<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf8f1" />
    <meta name="robots" content="noindex" />
    <title>主持页｜教会里那些大家都懂，但平常不太讲的事</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body class="host-page">
    <main class="host-lock" id="lockScreen" hidden>
      <section class="lock-card" aria-labelledby="lockTitle">
        <div class="lock-index mono">HOST / 01</div>
        <p class="eyebrow">ANONYMOUS FELLOWSHIP WALL</p>
        <h1 class="serif" id="lockTitle">主持人入口</h1>
        <p>输入部署时设置的简短口令，解锁揭晓与重置控制。</p>
        <form id="unlockForm" class="unlock-form">
          <label for="passcode">主持人口令</label>
          <div class="unlock-row">
            <input id="passcode" name="passcode" type="password" autocomplete="current-password" required autofocus />
            <button class="primary-button" type="submit">进入主持页 <span aria-hidden="true">→</span></button>
          </div>
          <p class="form-error" id="unlockError" role="alert" hidden></p>
        </form>
      </section>
    </main>

    <div id="hostApp" class="host-app" hidden>
      <header class="host-bar">
        <div class="host-brand">
          <span class="brand-mark serif">不太讲的事</span>
          <span class="mono">HOST CONSOLE</span>
        </div>
        <div class="host-status" aria-live="polite">
          <span class="status-dot" id="statusDot"></span>
          <span class="mono" id="connectionLabel">LIVE</span>
          <span class="host-response-count" id="barCount">0 份回答</span>
        </div>
        <div class="host-tools">
          <button class="text-button" id="resetButton" type="button">重置本场</button>
          <button class="text-button" id="lockButton" type="button">锁定</button>
        </div>
      </header>

      <main id="stage" class="host-stage" aria-live="polite"></main>
    </div>

    <dialog class="confirm-dialog" id="resetDialog">
      <form method="dialog" class="dialog-card">
        <p class="eyebrow">RESET EVENT</p>
        <h2 class="serif">清空本场所有答案？</h2>
        <p>这会立即删除当前收到的回答，无法撤销。适合活动开始前清掉测试数据。</p>
        <p class="form-error" id="resetError" role="alert" hidden></p>
        <div class="dialog-actions">
          <button class="secondary-button" value="cancel">先不清空</button>
          <button class="danger-button" id="confirmReset" value="confirm">确认清空</button>
        </div>
      </form>
    </dialog>

    <noscript>这个主持页需要启用 JavaScript。</noscript>
    <script type="module" src="../assets/js/host.js"></script>
  </body>
</html>
