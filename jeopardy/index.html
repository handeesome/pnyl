<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>认识团契的弟兄姊妹</title>
  <style>
    :root {
      --paper: #fbf8f1;
      --surface: #fffdfa;
      --surface-2: #f2ede2;
      --ink: #201b16;
      --muted: #6b6257;
      --faint: #9b8f80;
      --line: #ded2c1;
      --amber: #b66f2f;
      --amber-soft: #e4bf8f;
      --teal: #3f766d;
      --teal-soft: #dcebe7;
      --blue: #283f63;
      --shadow: 0 8px 30px rgba(54, 39, 22, 0.12);
      --radius: 8px;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(63, 118, 109, 0.06), transparent 260px),
        var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "tnum" 1, "kern" 1;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .app-shell {
      min-height: 100vh;
    }

    .serif {
      font-family: "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", "Noto Serif SC", SimSun, STSong, serif;
      font-weight: 500;
    }

    .mono {
      font-family: "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(222, 210, 193, 0.8);
      background: rgba(251, 248, 241, 0.86);
      backdrop-filter: blur(16px);
    }

    .topbar-main {
      min-height: 66px;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 10px 28px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 190px;
    }

    .brand-title {
      font-size: 22px;
      line-height: 1.1;
    }

    .brand-subtitle {
      color: var(--faint);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav button,
    .ghost-button,
    .ink-button,
    .soft-button,
    .danger-button {
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 9px 13px;
      transition: background 180ms ease, color 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .nav button,
    .ghost-button {
      color: var(--muted);
      background: transparent;
    }

    .nav button:hover,
    .ghost-button:hover {
      color: var(--ink);
      background: var(--surface-2);
    }

    .nav button.active {
      color: var(--paper);
      background: var(--ink);
    }

    .ink-button {
      color: var(--paper);
      background: var(--ink);
      border-color: var(--ink);
    }

    .ink-button:hover {
      transform: translateY(-1px);
      background: #312820;
    }

    .soft-button {
      color: var(--ink);
      background: var(--surface);
      border-color: var(--line);
    }

    .soft-button:hover {
      border-color: var(--amber);
      color: var(--amber);
    }

    .danger-button {
      color: #8b2f26;
      background: transparent;
      border-color: rgba(139, 47, 38, 0.25);
    }

    .danger-button:hover {
      background: rgba(139, 47, 38, 0.08);
    }

    .topbar-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .score-strip {
      display: grid;
      grid-template-columns: minmax(210px, 1fr) minmax(220px, 0.8fr) minmax(210px, 1fr);
      align-items: stretch;
      gap: 1px;
      border-top: 1px solid rgba(222, 210, 193, 0.65);
      background: rgba(222, 210, 193, 0.7);
    }

    .team-score,
    .picker-panel {
      background: rgba(255, 253, 250, 0.82);
      padding: 12px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 64px;
    }

    .team-score:last-child {
      justify-content: flex-end;
      text-align: right;
    }

    .team-name-button {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      text-align: inherit;
    }

    .team-score strong {
      display: block;
      font-size: 19px;
      line-height: 1.1;
    }

    .team-score span,
    .picker-panel span {
      color: var(--faint);
      font-size: 12px;
    }

    .score-number {
      color: var(--amber);
      font-size: 30px;
      min-width: 72px;
    }

    .score-controls {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .score-controls button {
      width: 50px;
      padding: 7px 0;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
    }

    .score-controls button:hover {
      color: var(--amber);
      border-color: var(--amber);
    }

    .picker-panel {
      justify-content: center;
      text-align: center;
      flex-direction: column;
      gap: 5px;
      background:
        linear-gradient(180deg, rgba(182, 111, 47, 0.16), rgba(255, 253, 250, 0.88)),
        rgba(255, 253, 250, 0.88);
    }

    .picker-panel strong {
      color: var(--amber);
      font-size: clamp(30px, 4.2vw, 54px);
      line-height: 1;
      text-shadow: 0 1px 0 rgba(255, 253, 250, 0.8);
    }

    .page {
      width: min(1180px, calc(100vw - 44px));
      margin: 0 auto;
      padding: 46px 0 76px;
    }

    .page.narrow {
      width: min(900px, calc(100vw - 44px));
    }

    .hero {
      min-height: calc(100vh - 146px);
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.8fr);
      gap: 46px;
      align-items: center;
    }

    .eyebrow {
      color: var(--amber);
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 82px);
      line-height: 1.02;
      letter-spacing: 0;
      margin-bottom: 22px;
    }

    .hero-lede {
      color: var(--muted);
      font-size: clamp(18px, 2vw, 24px);
      line-height: 1.72;
      max-width: 780px;
    }

    .hero-points {
      margin-top: 36px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .point {
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .point strong {
      display: block;
      margin-bottom: 6px;
      font-size: 17px;
    }

    .point span {
      color: var(--muted);
      line-height: 1.55;
    }

    .side-panel {
      border-left: 1px solid var(--line);
      padding-left: 30px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    .section-head h2 {
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.08;
      margin-bottom: 0;
    }

    .muted {
      color: var(--muted);
    }

    .faint {
      color: var(--faint);
    }

    .participant-list,
    .plain-list {
      display: grid;
      gap: 8px;
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
    }

    .participant-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--line);
      padding: 12px 0;
    }

    .participant-row:first-child {
      border-top: 0;
    }

    .person-index {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--paper);
      background: var(--teal);
      font-size: 12px;
    }

    .row-actions {
      display: flex;
      gap: 6px;
    }

    .row-actions button {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
    }

    .row-actions button:hover {
      color: var(--amber);
      border-color: var(--amber);
    }

    .rules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin: 28px 0 32px;
    }

    .rule-tile {
      background: rgba(255, 253, 250, 0.62);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
    }

    .rule-tile strong {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 17px;
    }

    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      flex: 0 0 auto;
    }

    .game-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 24px 0 10px;
    }

    .seating-wrap {
      margin-top: 34px;
      border-top: 1px solid var(--line);
      padding-top: 26px;
      overflow-x: auto;
    }

    .seating-diagram {
      position: relative;
      min-width: 1120px;
      height: var(--diagram-height, 460px);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 28px 0;
    }

    .u-table {
      position: absolute;
      left: 50%;
      top: var(--table-top, 50%);
      z-index: 0;
      width: min(54%, 560px);
      height: var(--table-height, 150px);
      transform: translate(-50%, -50%);
      border: 1px solid rgba(222, 210, 193, 0.95);
      border-top-color: transparent;
      border-radius: 0 0 90px 90px;
      background:
        linear-gradient(180deg, rgba(255, 253, 250, 0.2), rgba(228, 191, 143, 0.18)),
        rgba(255, 253, 250, 0.55);
      display: grid;
      place-items: center;
      color: var(--faint);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 12px;
    }

    .seat-node {
      position: absolute;
      z-index: 1;
      width: var(--seat-size, 112px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 35% 28%, rgba(255, 253, 250, 0.95), rgba(242, 237, 226, 0.96)),
        var(--surface);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 12px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(54, 39, 22, 0.08);
      transform: translate(-50%, -50%);
    }

    .seat-name {
      font-size: var(--seat-font, 22px);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .board-scroll {
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .board {
      min-width: 980px;
      display: grid;
      grid-template-columns: repeat(6, minmax(150px, 1fr));
      gap: 9px;
    }

    .board-column {
      display: grid;
      grid-template-rows: 88px repeat(5, 102px);
      gap: 9px;
    }

    .category-button,
    .score-cell {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      color: var(--paper);
      background: linear-gradient(180deg, var(--blue), #1d2d46);
      box-shadow: 0 6px 18px rgba(29, 45, 70, 0.12);
      transition: transform 160ms ease, border-color 160ms ease, filter 160ms ease;
    }

    .category-button {
      padding: 12px 10px;
      font-size: 17px;
      line-height: 1.25;
    }

    .category-button:hover,
    .score-cell:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .score-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
    }

    .score-cell strong {
      color: var(--amber-soft);
      font-size: clamp(28px, 3.4vw, 42px);
      line-height: 1;
    }

    .score-cell span {
      font-size: 13px;
      color: rgba(251, 248, 241, 0.72);
    }

    .score-cell.in-progress {
      border-color: var(--amber-soft);
      background: linear-gradient(180deg, #3f4f66, #233349);
    }

    .score-cell.done {
      color: var(--ink);
      background: linear-gradient(180deg, #e9dfcf, #d8c8b4);
      box-shadow: none;
    }

    .score-cell.done strong {
      color: var(--amber);
    }

    .score-cell.done span {
      color: var(--muted);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 28px;
      background: rgba(32, 27, 22, 0.32);
      backdrop-filter: blur(6px);
      animation: fadeIn 180ms ease both;
    }

    .modal {
      width: min(1060px, 100%);
      max-height: min(88vh, 860px);
      overflow: auto;
      background: var(--surface);
      border: 1px solid rgba(222, 210, 193, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      animation: slideUp 220ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .modal-refresh-stable .modal-backdrop,
    .modal-refresh-stable .modal {
      animation: none;
    }

    .spotlight {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      place-items: center;
      pointer-events: none;
      padding: 24px;
      animation: spotlightFade 2000ms ease both;
    }

    .spotlight-card {
      min-width: min(620px, calc(100vw - 48px));
      border: 1px solid rgba(228, 191, 143, 0.72);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255, 253, 250, 0.96), rgba(242, 237, 226, 0.94)),
        var(--surface);
      box-shadow: 0 18px 60px rgba(32, 27, 22, 0.24);
      padding: 34px 44px;
      text-align: center;
      animation: spotlightCard 2000ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .spotlight-kicker {
      color: var(--amber);
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .spotlight-title {
      font-size: clamp(34px, 5vw, 64px);
      line-height: 1.08;
      margin: 0;
    }

    .spotlight-lines {
      margin-top: 16px;
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: clamp(20px, 2.5vw, 30px);
      line-height: 1.35;
    }

    .modal.narrow-modal {
      width: min(620px, 100%);
    }

    .modal-header,
    .modal-footer {
      position: sticky;
      background: rgba(255, 253, 250, 0.9);
      backdrop-filter: blur(10px);
      z-index: 2;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-color: var(--line);
    }

    .modal-header {
      top: 0;
      border-bottom: 1px solid var(--line);
    }

    .modal-footer {
      bottom: 0;
      border-top: 1px solid var(--line);
    }

    .modal-title {
      margin: 0;
      font-size: 27px;
      line-height: 1.2;
    }

    .modal-body {
      padding: 24px;
    }

    .close-button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      padding: 8px 10px;
    }

    .close-button:hover {
      color: var(--ink);
      border-color: var(--amber);
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    .field label {
      color: var(--muted);
      font-size: 14px;
    }

    .field input,
    .field select {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      padding: 10px 2px;
      outline: none;
      font-size: 18px;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--amber);
    }

    .team-draft {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .team-block {
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }

    .team-block h3 {
      margin-bottom: 12px;
      font-size: 22px;
    }

    .prompt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .prompt-card {
      min-height: 320px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f8f2e8;
      perspective: 1200px;
      overflow: hidden;
    }

    .prompt-card.blank {
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(63, 118, 109, 0.08), transparent),
        var(--surface-2);
    }

    .blank-card-button {
      width: 100%;
      height: 100%;
      min-height: 320px;
      border: 0;
      background: transparent;
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .blank-card-button strong {
      display: block;
      font-size: 34px;
      margin-bottom: 8px;
    }

    .card-face {
      min-height: 320px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transform-origin: center;
      transform-style: preserve-3d;
    }

    .card-face.reveal-animate {
      animation: flipIn 980ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .card-owner {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      color: var(--amber);
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .prompt-text {
      font-size: clamp(22px, 2.4vw, 34px);
      line-height: 1.45;
    }

    .card-face.reveal-animate .prompt-text {
      animation: textDevelop 900ms ease 320ms both;
    }

    .forbidden-list {
      margin-top: auto;
      border-top: 1px solid var(--line);
      padding-top: 14px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .helper-panel {
      margin-top: auto;
      border-top: 1px solid var(--line);
      padding-top: 14px;
      display: grid;
      gap: 10px;
    }

    .helper-line {
      color: var(--muted);
      line-height: 1.55;
    }

    .pre-reveal {
      min-height: 320px;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background:
        linear-gradient(135deg, rgba(63, 118, 109, 0.08), transparent),
        var(--surface-2);
    }

    .pre-reveal h3 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .covered {
      min-height: 320px;
      display: grid;
      place-items: center;
      padding: 26px;
      text-align: center;
      color: var(--muted);
      background:
        repeating-linear-gradient(0deg, rgba(222, 210, 193, 0.22), rgba(222, 210, 193, 0.22) 1px, transparent 1px, transparent 38px),
        var(--surface);
    }

    .timer-box {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
    }

    .timer-time {
      font-size: clamp(38px, 6vw, 68px);
      color: var(--teal);
      min-width: 170px;
    }

    .footer-timer {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-right: auto;
    }

    .footer-timer .timer-time {
      font-size: clamp(28px, 3vw, 42px);
      min-width: 112px;
    }

    .popup-score-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
    }

    .popup-score-team {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      border-radius: 7px;
      padding: 5px 7px;
    }

    .popup-score-team.score-flash {
      animation: scoreFlip 720ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .status-note {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .rule-text {
      font-size: 20px;
      line-height: 1.75;
      color: var(--muted);
    }

    .example-lines {
      margin: 18px 0 0;
      padding: 18px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 17px;
    }

    .empty-state {
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 14px;
      line-height: 1.7;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes flipIn {
      from {
        opacity: 0;
        transform: rotateY(-84deg) scale(0.96);
      }
      55% { opacity: 1; }
      to {
        opacity: 1;
        transform: rotateY(0) scale(1);
      }
    }

    @keyframes textDevelop {
      from {
        opacity: 0;
        transform: translateY(8px);
        filter: blur(2px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes scoreFlip {
      from {
        background: rgba(182, 111, 47, 0);
        transform: rotateX(-35deg);
      }
      45% {
        background: rgba(182, 111, 47, 0.22);
        transform: rotateX(0);
      }
      to {
        background: rgba(182, 111, 47, 0);
        transform: rotateX(0);
      }
    }

    @keyframes spotlightFade {
      0% { opacity: 0; }
      12% { opacity: 1; }
      82% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes spotlightCard {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.96);
        filter: blur(3px);
      }
      18% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
      78% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-10px) scale(0.98);
      }
    }

    @media (max-width: 900px) {
      .topbar-main {
        align-items: flex-start;
        flex-direction: column;
      }

      .topbar-actions {
        margin-left: 0;
        justify-content: flex-start;
      }

      .score-strip {
        grid-template-columns: 1fr;
      }

      .team-score,
      .team-score:last-child,
      .picker-panel {
        justify-content: flex-start;
        text-align: left;
      }

      .hero {
        min-height: auto;
        grid-template-columns: 1fr;
      }

      .side-panel {
        border-left: 0;
        border-top: 1px solid var(--line);
        padding-left: 0;
        padding-top: 24px;
      }

      .hero-points,
      .rules-grid,
      .team-draft {
        grid-template-columns: 1fr;
      }

      .page {
        width: min(100% - 28px, 1180px);
        padding-top: 30px;
      }

      .modal-backdrop {
        padding: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="app-shell"></div>

  <script>
    const STORAGE_KEY = "fellowship-jeopardy-state:v1";

    const STAGES = [
      { id: "home", label: "首页" },
      { id: "game1", label: "游戏一" },
      { id: "jeopardy", label: "Jeopardy" }
    ];

    const M_AND_M_RULES = [
      { color: "红色", hex: "#b94b3f", prompt: "这周一个开心瞬间" },
      { color: "黄色", hex: "#d9ad3f", prompt: "最近一个想感谢的人" },
      { color: "蓝色", hex: "#3d6f9f", prompt: "最近一个小压力" },
      { color: "绿色", hex: "#4d8a59", prompt: "如果这周可以休息一天，你想怎么过" },
      { color: "橙色", hex: "#d98236", prompt: "最近一个让你觉得被照顾或被鼓励的瞬间" },
      { color: "棕色", hex: "#7a5138", prompt: "最近一个神可能在提醒你的地方" }
    ];

    const CATEGORY_RULES = {
      consensus: {
        title: "默契指认",
        rule: "两队每个人各自在听到题目的瞬间指认一个人，裁判看理由是否贴切，是不是多数。",
        example: "例子：本队谁最像聚会结束后会主动留下来收拾？大家同时指认，并说一个观察理由。"
      },
      teammate: {
        title: "队友了解",
        rule: "随机抽一位回答者和一位被了解者，回答者回答关于被了解者的问题，被了解者提前写下答案。分值越高要求越具体。",
        example: "例子：系统抽到小林回答小周：小周更喜欢先把事情计划清楚，还是边做边调整？"
      },
      order: {
        title: "团队排序",
        rule: "队伍内部排序，裁判看是否合理，队员可反驳。",
        example: "例子：按最喜欢提前到场 → 最常刚好准时排序。"
      },
      timed: {
        title: "限时说出",
        rule: "队伍轮流说，不能重复，卡住超过3秒结束，最后看说了几个。100到300分为60秒，400分为90秒，500分为两队共同参与的5分钟活动。",
        example: "例子：60秒说出尽可能多教会里常见的服事岗位。"
      },
      taboo: {
        title: "禁词描述",
        rule: "一人描述，队友猜；说出禁词则失败。描述者可以先看题，之后主持人把白板盖回，其他队友再看大屏。",
        example: "例子：描述“葡萄树”，禁词：枝子、果子、约翰福音。"
      },
      story: {
        title: "五三二圣经故事",
        rule: "三人按5字、3字、2字轮流讲故事；两字位必须说有意义的内容。",
        example: "例子：耶稣平静风浪，三个人顺序是 5字 / 3字 / 2字\nA：门徒很害怕\nB：风很大\nC：主睡\nA：他们叫耶稣\nB：救救我\nC：起来\nA：耶稣斥责风\nB：海就静\nC：真神\n\n“两字的人”不能只说“然后”“所以”“但是”，必须推进故事，比如“主睡”“起来”“真神”。"
      }
    };

    const BOARD = [
      {
        id: "consensus",
        title: CATEGORY_RULES.consensus.title,
        prompts: {
          100: ["本队谁最像会提前查好旅行攻略？", "本队谁最像会把气氛带起来？"],
          200: ["本队谁最可能临时约大家出去玩？", "本队谁最可能把小事讲得很好笑？"],
          300: ["本队谁最可能第一个注意到有人不太舒服或没进入状态？", "本队谁最可能默默把别人没做完的事收尾？"],
          400: ["本队谁最像“外表淡定，内心戏很多”？", "本队谁最像“关键时刻最可靠”？"],
          500: ["本队谁最像“别人遇到困难时会想到可以找的人”？说明理由。", "本队谁最可能在大家都没注意的时候，默默让一件事变得更顺利？说明理由。"]
        }
      },
      {
        id: "teammate",
        title: CATEGORY_RULES.teammate.title,
        prompts: {
          100: ["B更喜欢甜口还是咸口？", "B更喜欢早起还是晚睡？"],
          200: ["B更喜欢宅家休息还是出去走走？", "B最近最常喝的饮料大概是什么？"],
          300: ["B如果有一整天空闲，最可能做什么？", "B最常用来放松的方式是什么？"],
          400: ["B最近一个小压力大概来自哪方面？", "B最近最想被代祷的一类事是什么？"],
          500: ["B这周最期待的一件具体事是什么？", "B最近常听的一首歌/播客/视频类型是什么？"]
        }
      },
      {
        id: "order",
        title: CATEGORY_RULES.order.title,
        prompts: {
          100: ["按最早睡 → 最晚睡排序。", "按最爱奶茶/咖啡 → 最不爱排序。"],
          200: ["按最会做饭 → 最不会做饭排序。", "按最会拍照 → 最不会拍照排序。"],
          300: ["按最计划型 → 最随性排序。", "按最容易约出来 → 最难约出来排序。"],
          400: ["按最适合带破冰 → 最适合安静倾听排序。", "按最适合主讲 → 最适合幕后支持排序。"],
          500: ["按“遇到突发情况时，最先行动 → 最先观察思考”排序。", "按“表达关心更直接明显 → 表达关心更安静含蓄”排序。"]
        }
      },
      {
        id: "timed",
        title: CATEGORY_RULES.timed.title,
        prompts: {
          100: ["60秒说出尽可能多小时候主日学/教会出现过的点心。", "60秒说出尽可能多小时候去教会会听到的大人常说的话。"],
          200: ["60秒说出尽可能多圣经人物。", "60秒说出尽可能多圣经地名。"],
          300: ["60秒说出尽可能多鼓励一个人的具体行动。", "60秒说出尽可能多让新朋友觉得被欢迎的做法。"],
          400: ["90秒说出尽可能多小组容易冷场的原因。", "90秒说出尽可能多小组变温暖的方法。"],
          500: ["两队都参与：各自花5分钟设计一个不错的团契活动。要包含主题、流程、互动方式。裁判选更完整、更好玩的队伍得分。"]
        },
        sharedValues: [500]
      },
      {
        id: "taboo",
        title: CATEGORY_RULES.taboo.title,
        prompts: {
          100: [
            { text: "描述“方舟”", forbidden: ["挪亚", "洪水", "船"] },
            { text: "描述“牧羊人”", forbidden: ["羊", "草", "杖"] }
          ],
          200: [
            { text: "描述“五饼二鱼”", forbidden: ["鱼", "饼", "五千人"] },
            { text: "描述“最后的晚餐”", forbidden: ["耶稣", "门徒", "饼杯"] }
          ],
          300: [
            { text: "描述“浪子回头”", forbidden: ["父亲", "儿子", "回家"] },
            { text: "描述“好撒玛利亚人”", forbidden: ["帮助", "路上", "受伤"] }
          ],
          400: [
            { text: "描述“恩典”", forbidden: ["白白", "赦免", "礼物"] },
            { text: "描述“信心”", forbidden: ["相信", "看见", "神"] }
          ],
          500: [
            { text: "描述“悔改”", forbidden: ["认罪", "回转", "错"] },
            { text: "描述“交托”", forbidden: ["放手", "相信", "神"] }
          ]
        }
      },
      {
        id: "story",
        title: CATEGORY_RULES.story.title,
        prompts: {
          100: ["耶稣平静风浪。", "大卫打歌利亚。"],
          200: ["浪子回头。", "挪亚方舟。"],
          300: ["好撒玛利亚人。", "耶稣喂饱五千人。"],
          400: ["约拿逃跑。", "彼得三次不认主。"],
          500: ["出埃及过红海。", "保罗大马士革归主。"]
        }
      }
    ];

    const VALUES = [100, 200, 300, 400, 500];
    let state = loadState();
    let ui = {
      modal: null,
      editingParticipantId: null,
      activeCell: null,
      activeCategoryId: null,
      activeTeamId: null,
      teamDraft: null,
      timer: null,
      justRevealed: null,
      scoreFlashTeam: null,
      stableModalRender: false,
      spotlight: null
      };

    function defaultState() {
      return {
        version: 1,
        stage: "home",
        participants: [],
        seating: null,
        teams: null,
        currentTeam: "A",
        currentPickerId: null,
        pickerCounts: {},
        board: {}
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        return { ...defaultState(), ...parsed };
      } catch (error) {
        return defaultState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function uid() {
      return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 9)}`;
    }

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function participantById(id) {
      return state.participants.find((person) => person.id === id) || null;
    }

    function participantName(id) {
      return participantById(id)?.nickname || "暂无人员";
    }

    function otherTeam(teamId) {
      return teamId === "A" ? "B" : "A";
    }

    function teamById(teamId) {
      return state.teams?.[teamId] || null;
    }

    function teamName(teamId) {
      return teamById(teamId)?.name || `${teamId}队`;
    }

    function teamMembers(teamId) {
      const team = teamById(teamId);
      if (!team) return [];
      return team.memberIds
        .map((id) => participantById(id))
        .filter(Boolean);
    }

    function cellKey(categoryId, value) {
      return `${categoryId}:${value}`;
    }

    function categoryById(categoryId) {
      return BOARD.find((category) => category.id === categoryId);
    }

    function getPrompts(categoryId, value) {
      return categoryById(categoryId).prompts[value] || [];
    }

    function isSharedCell(category, value) {
      return Boolean(category.sharedValues?.includes(Number(value)));
    }

    function getCell(categoryId, value) {
      const category = categoryById(categoryId);
      const prompts = getPrompts(categoryId, value);
      const key = cellKey(categoryId, value);
      const saved = state.board[key] || {};
      const count = prompts.length;
      return {
        key,
        categoryId,
        value: Number(value),
        shared: isSharedCell(category, value),
        revealed: Array.from({ length: count }, (_, index) => Boolean(saved.revealed?.[index])),
        concealed: Array.from({ length: count }, (_, index) => Boolean(saved.concealed?.[index])),
        cardOwners: Array.from({ length: count }, (_, index) => saved.cardOwners?.[index] || null),
        helpers: saved.helpers || {},
        completed: Boolean(saved.completed)
      };
    }

    function ensureCell(categoryId, value) {
      const cell = getCell(categoryId, value);
      state.board[cell.key] = {
        revealed: cell.revealed,
        concealed: cell.concealed,
        cardOwners: cell.cardOwners,
        helpers: cell.helpers,
        completed: cell.completed
      };
      return state.board[cell.key];
    }

    function getDuration(categoryId, value) {
      if (categoryId !== "timed") return 0;
      if (Number(value) === 500) return 300;
      if (Number(value) === 400) return 90;
      return 60;
    }

    function formatTime(seconds) {
      const safe = Math.max(0, Number(seconds) || 0);
      const minutes = Math.floor(safe / 60);
      const rest = safe % 60;
      return `${String(minutes).padStart(2, "0")}:${String(rest).padStart(2, "0")}`;
    }

    function render() {
      const app = document.getElementById("app");
      app.className = `app-shell${ui.stableModalRender ? " modal-refresh-stable" : ""}`;
      app.innerHTML = `
        ${renderHeader()}
        ${renderStage()}
        ${renderModal()}
        ${renderSpotlight()}
      `;
      ui.stableModalRender = false;
    }

    function renderInsideModal() {
      ui.stableModalRender = true;
      render();
    }

    function renderSpotlight() {
      if (!ui.spotlight) return "";
      return `
        <div class="spotlight" aria-live="polite">
          <div class="spotlight-card">
            <div class="spotlight-kicker mono">${escapeHtml(ui.spotlight.kicker)}</div>
            <h2 class="spotlight-title serif">${escapeHtml(ui.spotlight.title)}</h2>
            <div class="spotlight-lines">
              ${ui.spotlight.lines.map((line) => `<div>${escapeHtml(line)}</div>`).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function showSpotlight(kicker, title, lines = []) {
      const key = uid();
      ui.spotlight = { key, kicker, title, lines };
      if (ui.modal) renderInsideModal();
      else render();
      setTimeout(() => {
        if (ui.spotlight?.key === key) {
          ui.spotlight = null;
          if (ui.modal) renderInsideModal();
          else render();
        }
      }, 2000);
    }

    function renderHeader() {
      const nav = STAGES.map((stage) => `
        <button type="button" class="${state.stage === stage.id ? "active" : ""}" onclick="setStage('${stage.id}')">
          ${stage.label}
        </button>
      `).join("");

      return `
        <header class="topbar">
          <div class="topbar-main">
            <div class="brand">
              <div class="brand-title serif">认识团契的弟兄姊妹</div>
              <div class="brand-subtitle mono">Fellowship Night</div>
            </div>
            <nav class="nav" aria-label="阶段导航">${nav}</nav>
            <div class="topbar-actions">
              <button type="button" class="soft-button" onclick="openParticipantModal()">添加人员</button>
              <button type="button" class="danger-button" onclick="resetActivity()">重置整场</button>
            </div>
          </div>
          ${state.stage === "jeopardy" && state.teams ? renderScoreStrip() : ""}
        </header>
      `;
    }

    function renderScoreStrip() {
      return `
        <div class="score-strip">
          ${renderTeamScore("A")}
          <div class="picker-panel">
            <span>当前选题人</span>
            <strong class="serif">${escapeHtml(participantName(state.currentPickerId))}</strong>
            <span>${escapeHtml(teamName(state.currentTeam))}</span>
          </div>
          ${renderTeamScore("B")}
        </div>
      `;
    }

    function renderTeamScore(teamId) {
      const team = teamById(teamId);
      return `
        <div class="team-score">
          <button type="button" class="team-name-button" onclick="openTeamModal('${teamId}')">
            <strong class="serif">${escapeHtml(team?.name || `${teamId}队`)}</strong>
            <span>${teamMembers(teamId).length} 人，点击查看成员</span>
          </button>
          <div class="score-number mono">${team?.score || 0}</div>
          <div class="score-controls" aria-label="${escapeHtml(team?.name || teamId)} 调分">
            <button type="button" onclick="addScore('${teamId}', 100)">+100</button>
            <button type="button" onclick="addScore('${teamId}', -100)">-100</button>
          </div>
        </div>
      `;
    }

    function renderStage() {
      if (state.stage === "game1") return renderGameOne();
      if (state.stage === "jeopardy") return renderJeopardy();
      return renderHome();
    }

    function renderHome() {
      return `
        <main class="page hero">
          <section>
            <div class="eyebrow mono">Tonight's Theme</div>
            <h1 class="serif">在团契中重新认识彼此</h1>
            <p class="hero-lede">
              今晚的活动不是为了制造热闹，而是创造一个更容易开口、聆听和彼此关心的空间。通过座位、问题和团队游戏，我们练习在熟悉的人中看见新的故事，也把认识带进更具体的代祷与陪伴。
            </p>
            <div class="hero-points">
              <div class="point">
                <strong class="serif">看见生活处境</strong>
                <span>从轻松的问题开始，听见彼此最近真实经历的喜乐、压力和感谢。</span>
              </div>
              <div class="point">
                <strong class="serif">练习主动聆听</strong>
                <span>让回答不只是轮到谁说话，也成为大家彼此观察和回应的机会。</span>
              </div>
              <div class="point">
                <strong class="serif">把认识带入代祷</strong>
                <span>把今晚听见的故事变成更具体的关心，也带到之后的祷告里。</span>
              </div>
            </div>
            <div class="game-actions">
              <button type="button" class="ink-button" onclick="setStage('game1')">进入游戏一</button>
              <button type="button" class="soft-button" onclick="openParticipantModal()">先添加人员</button>
            </div>
          </section>
          <aside class="side-panel">
            <div class="section-head">
              <div>
                <h2 class="serif">参与人员</h2>
                <p class="muted">当前 ${state.participants.length} 人。名单会用于座位、分组和随机抽人。</p>
              </div>
            </div>
            ${renderParticipantList()}
          </aside>
        </main>
      `;
    }

    function renderParticipantList() {
      if (state.participants.length === 0) {
        return `<div class="empty-state">还没有添加人员。点击“添加人员”，输入 nickname 即可开始。</div>`;
      }

      return `
        <ul class="participant-list">
          ${state.participants.map((person, index) => `
            <li class="participant-row">
              <span class="person-index mono">${index + 1}</span>
              <strong>${escapeHtml(person.nickname)}</strong>
              <span class="row-actions">
                <button type="button" onclick="openParticipantModal('${person.id}')">改名</button>
                <button type="button" onclick="deleteParticipant('${person.id}')">删除</button>
              </span>
            </li>
          `).join("")}
        </ul>
      `;
    }

    function renderGameOne() {
      return `
        <main class="page">
          <div class="section-head">
            <div>
              <div class="eyebrow mono">Game One</div>
              <h2 class="serif">M&M 糖果问题</h2>
              <p class="muted">每个人轮流拿一颗糖，按颜色回答一个问题。结束后，为自己右手边的人祷告。</p>
            </div>

      }

      const layout = buildSeatPositions(state.seating.orderIds);
      return `

          <div class="u-table mono">桌面</div>

        </div>
      `;
    }

    function buildSeatPositions(orderIds) {
      const n = orderIds.length;
      const seatSize = n <= 10 ? 112 : n <= 14 ? 100 : 88;
      const fontSize = n <= 10 ? 22 : n <= 14 ? 20 : 18;
      if (n === 1) {
        return {
          height: 360,
          seatSize,
          fontSize,
          tableHeight: 150,
          tableTop: 50,
          seats: [{ id: orderIds[0], x: 50, y: 78 }]
        };
      }

      const bottomCount = n <= 2 ? n : n <= 4 ? n : n === 5 ? 3 : 4;
      const remaining = Math.max(0, n - bottomCount);
      const leftCount = Math.ceil(remaining / 2);
      const rightCount = remaining - leftCount;
      const maxSide = Math.max(leftCount, rightCount, 1);
      const gap = n <= 12 ? 20 : 16;
      const topMargin = 22;
      const bottomBand = seatSize + 42;
      const height = Math.max(460, topMargin + maxSide * seatSize + (maxSide - 1) * gap + bottomBand);
      const sideStartY = topMargin + seatSize / 2;
      const sideStep = seatSize + gap;
      const bottomY = height - seatSize / 2 - 16;
      const tableTopPx = Math.max(42, sideStartY - seatSize * 0.36);
      const tableBottomPx = Math.max(tableTopPx + seatSize * 1.35, bottomY - seatSize * 0.68);
      const tableHeight = Math.round(tableBottomPx - tableTopPx);
      const tableTop = ((tableTopPx + tableHeight / 2) / height) * 100;
      const bottomStartX = bottomCount <= 2 ? 38 : bottomCount === 3 ? 30 : 25;
      const bottomEndX = 100 - bottomStartX;
      const seats = [];
      let cursor = 0;

      for (let i = 0; i < leftCount; i += 1) {
        seats.push({
          id: orderIds[cursor++],
          x: 15,
          y: ((sideStartY + i * sideStep) / height) * 100
        });
      }

      for (let i = 0; i < bottomCount && cursor < n; i += 1) {
        const ratio = bottomCount === 1 ? 0.5 : i / (bottomCount - 1);
        seats.push({
          id: orderIds[cursor++],
          x: bottomStartX + ratio * (bottomEndX - bottomStartX),
          y: (bottomY / height) * 100
        });
      }

      for (let i = rightCount - 1; i >= 0 && cursor < n; i -= 1) {
        seats.push({
          id: orderIds[cursor++],
          x: 85,
          y: ((sideStartY + i * sideStep) / height) * 100
        });
      }

      return { height, seatSize, fontSize, tableHeight, tableTop, bottomCount, seats };
    }

    function renderCellModal() {
      if (!ui.activeCell) return "";
      const { categoryId, value } = ui.activeCell;
      const category = categoryById(categoryId);
      const prompts = getPrompts(categoryId, value);
      const cell = getCell(categoryId, value);
      const canFinish = cell.revealed.every(Boolean);
      const alreadyDone = cell.completed;
      const timerHtml = categoryId === "timed" ? renderTimer(categoryId, value) : "";
      const footerNote = alreadyDone ? "这一格已经完成，可以复看内容。" : canFinish ? "两张卡已经翻开，可以完成并切换到下一队。" : "可以返回，不会强制翻开剩余卡片。";

      return `
        <div class="modal-backdrop" onclick="closeModal()">
          <section class="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
            <header class="modal-header">
              <div>
                <div class="eyebrow mono">${escapeHtml(category.title)} · ${value}</div>
                <h2 class="modal-title serif">${cell.shared ? "两队共同题" : "两张隐藏卡"}</h2>
              </div>
              <button type="button" class="close-button" onclick="closeModal()">返回</button>
            </header>
            <div class="modal-body">
              ${renderPopupScoreControls()}
              <div class="prompt-grid">
                ${prompts.map((prompt, index) => renderPromptCard(categoryId, value, prompt, index, cell)).join("")}
              </div>
            </div>
            <footer class="modal-footer">
              ${timerHtml || `<span class="status-note">${footerNote}</span>`}
              <div class="game-actions" style="margin:0">
                <button type="button" class="soft-button" onclick="closeModal()">返回</button>
                <button type="button" class="ink-button" onclick="finishCell()" ${alreadyDone || !canFinish ? "disabled" : ""}>完成</button>
              </div>
            </footer>
          </section>
        </div>
      `;
    }

    function renderPopupScoreControls() {
      if (!state.teams) return "";
      return `
        <div class="popup-score-controls">
          <span class="status-note">手动计分</span>
          <strong class="serif popup-score-team ${ui.scoreFlashTeam === "A" ? "score-flash" : ""}">${escapeHtml(teamName("A"))}: <span class="mono">${state.teams.A.score}</span></strong>
          <div class="score-controls">
            <button type="button" onclick="addScore('A', 100, true)">+100</button>
            <button type="button" onclick="addScore('A', -100, true)">-100</button>
          </div>
          <strong class="serif popup-score-team ${ui.scoreFlashTeam === "B" ? "score-flash" : ""}">${escapeHtml(teamName("B"))}: <span class="mono">${state.teams.B.score}</span></strong>
          <div class="score-controls">
            <button type="button" onclick="addScore('B', 100, true)">+100</button>
            <button type="button" onclick="addScore('B', -100, true)">-100</button>
          </div>
        </div>
      `;
    }

    function renderTimer(categoryId, value) {
      const duration = getDuration(categoryId, value);
      if (!duration) return "";
      if (!ui.timer || ui.timer.key !== cellKey(categoryId, value)) {
        resetTimerState(categoryId, value);
      }
      return `
        <div class="footer-timer">
          <div class="timer-time mono" data-timer-time>${formatTime(ui.timer.remaining)}</div>
          <button type="button" class="ink-button" onclick="startTimer()">${ui.timer.running ? "继续中" : "开始"}</button>
          <button type="button" class="soft-button" onclick="pauseTimer()">暂停</button>
          <button type="button" class="soft-button" onclick="resetTimer()">重置</button>
          <span class="status-note">${Number(value) === 500 ? "共同题：两队各自讨论并设计方案，不需要抽起始人。" : "读完题目后再开始倒数。"}</span>
        </div>
      `;
    }

    function renderPromptCard(categoryId, value, prompt, index, cell) {
      const revealed = cell.revealed[index];
      const owner = predictedOwner(cell, index);
      const concealed = cell.concealed[index];
      const helperKey = `${index}`;
      const helper = cell.helpers[helperKey] || {};

      if (!revealed) {
        if (needsPreRevealHelper(categoryId)) {
          return renderPreRevealHelper(categoryId, value, index, owner, helper);
        }
        const helperLabel = cell.shared ? "共同题" : cell.revealed.some(Boolean) ? `${escapeHtml(teamName(otherTeam(state.currentTeam)))} 待选` : "空白卡片";
        return `
          <div class="prompt-card blank">
            <button type="button" class="blank-card-button" onclick="revealCard(${index})">
              <span>
                <strong class="serif">点击翻开</strong>
                <span class="muted">${helperLabel}</span>
              </span>
            </button>
          </div>
        `;
      }

      if (concealed) {
        return `
          <div class="prompt-card">
            <div class="covered">
              <div>
                <div class="eyebrow mono">${escapeHtml(ownerLabel(owner))}</div>
                <h3 class="serif">白板已盖回</h3>
                <p>题目内容暂时隐藏，方便其他队友重新面向大屏。</p>
                <button type="button" class="soft-button" onclick="toggleConceal(${index})">重新显示</button>
              </div>
            </div>
          </div>
        `;
      }

      return `
        <div class="prompt-card">
          <article class="card-face ${ui.justRevealed === `${cell.key}:${index}` ? "reveal-animate" : ""}">
            <div class="card-owner mono">
              <span>${escapeHtml(ownerLabel(owner))}</span>
              <span>Card ${index + 1}</span>
            </div>
            ${renderPromptContent(categoryId, prompt, helper)}
            ${renderHelper(categoryId, value, index, owner, helper)}
          </article>
        </div>
      `;
    }

    function predictedOwner(cell, index) {
      if (cell.shared) return "shared";
      if (cell.cardOwners[index]) return cell.cardOwners[index];
      return cell.revealed.some(Boolean) ? otherTeam(state.currentTeam) : state.currentTeam;
    }

    function needsPreRevealHelper(categoryId) {
      return categoryId === "teammate" || categoryId === "taboo" || categoryId === "story";
    }

    function helperReady(categoryId, helper) {
      if (categoryId === "teammate") return Array.isArray(helper.pair) && helper.pair.length === 2;
      if (categoryId === "taboo") return Boolean(helper.describer);
      if (categoryId === "story") return Boolean(helper.roles?.five && helper.roles?.three && helper.roles?.two);
      return true;
    }

    function renderPreRevealHelper(categoryId, value, index, owner, helper) {
      const ready = helperReady(categoryId, helper);
      const ownerText = owner === "shared" ? "两队共同题" : teamName(owner);
      let title = "先完成随机";
      let body = "";
      let action = "";

      if (categoryId === "teammate") {
        title = "先随机回答者和被了解者";
        body = ready
          ? `${participantName(helper.pair[0])} 回答，${participantName(helper.pair[1])} 提前写下答案。`
          : `${ownerText} 需要先抽出两个人。`;
        action = `<button type="button" class="soft-button" onclick="drawTeammatePair(${index})">随机回答者 / 被了解者</button>`;
      } else if (categoryId === "taboo") {
        title = "先随机描述者";
        body = ready
          ? `描述者：${participantName(helper.describer)}。描述者可以看题，其他人暂时不要看。`
          : `${ownerText} 需要先抽出一位描述者。`;
        action = `<button type="button" class="soft-button" onclick="drawDescriber(${index})">随机描述者</button>`;
      } else if (categoryId === "story") {
        title = "先随机五三二分工";
        body = ready
          ? `5字：${participantName(helper.roles.five)}，3字：${participantName(helper.roles.three)}，2字：${participantName(helper.roles.two)}。`
          : `${ownerText} 需要先抽出三位成员。`;
        action = `<button type="button" class="soft-button" onclick="drawStoryRoles(${index})">随机 5 / 3 / 2</button>`;
      }

      return `
        <div class="prompt-card blank">
          <div class="pre-reveal">
            <div>
              <div class="eyebrow mono">${escapeHtml(ownerText)}</div>
              <h3 class="serif">${escapeHtml(title)}</h3>
              <p class="helper-line">${escapeHtml(body)}</p>
              <div class="game-actions" style="justify-content:center">
                ${action}
                <button type="button" class="ink-button" onclick="revealCard(${index})" ${ready ? "" : "disabled"}>翻开题目</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderPromptContent(categoryId, prompt, helper = {}) {
      if (categoryId === "teammate") {
        return `<div class="prompt-text serif">${escapeHtml(formatTeammatePrompt(prompt, helper))}</div>`;
      }
      if (categoryId === "taboo" && typeof prompt === "object") {
        return `
          <div class="prompt-text serif">${escapeHtml(prompt.text)}</div>
          <div class="forbidden-list">
            禁词：${prompt.forbidden.map(escapeHtml).join("、")}
          </div>
        `;
      }
      return `<div class="prompt-text serif">${escapeHtml(prompt)}</div>`;
    }

    function formatTeammatePrompt(prompt, helper) {
      if (!Array.isArray(helper.pair) || helper.pair.length < 2) return String(prompt);
      const answerer = participantName(helper.pair[0]);
      const subject = participantName(helper.pair[1]);
      const question = String(prompt).replace(/^B/, subject);
      return `${answerer}回答：${question}`;
    }

    function renderHelper(categoryId, value, index, owner, helper = null) {
      if (!owner || owner === "shared") {
        return categoryId === "timed" && Number(value) === 500
          ? `<div class="helper-panel"><div class="helper-line">共同题不抽人。两队各自讨论 5 分钟后给出方案。</div></div>`
          : "";
      }

      if (!helper) {
        const cell = getCell(ui.activeCell.categoryId, ui.activeCell.value);
        helper = cell.helpers[`${index}`] || {};
      }

      if (categoryId === "teammate") {
        return `
          <div class="helper-panel">
            <div class="helper-line">${helper.pair ? `${escapeHtml(participantName(helper.pair[0]))} 回答，${escapeHtml(participantName(helper.pair[1]))} 提前写下答案。` : "已经翻开。若这里没有人名，返回后重新抽人。"}</div>
          </div>
        `;
      }

      if (categoryId === "taboo") {
        return `
          <div class="helper-panel">
            <div class="game-actions" style="margin:0">
              <button type="button" class="soft-button" onclick="toggleConceal(${index})">盖回白板</button>
            </div>
            <div class="helper-line">${helper.describer ? `描述者：${escapeHtml(participantName(helper.describer))}` : "先让描述者看题，看完后可以盖回白板。"}</div>
          </div>
        `;
      }

      if (categoryId === "timed") {
        return `
          <div class="helper-panel">
            <button type="button" class="soft-button" onclick="drawStarter(${index})">随机起始人</button>
            <div class="helper-line">${helper.starter ? `从 ${escapeHtml(participantName(helper.starter))} 开始，队伍按座位或站位顺序轮流。` : "抽一个起始人，然后队伍轮流说。"}</div>
          </div>
        `;
      }

      if (categoryId === "story") {
        const roles = helper.roles;
        return `
          <div class="helper-panel">
            <div class="helper-line">${
              roles
                ? `5字：${escapeHtml(participantName(roles.five))}，3字：${escapeHtml(participantName(roles.three))}，2字：${escapeHtml(participantName(roles.two))}`
                : "从本队随机三个人，分别负责 5 字、3 字、2 字。"
            }</div>
          </div>
        `;
      }

      return "";
    }

    function ownerLabel(owner) {
      if (owner === "shared") return "两队共同题";
      if (!owner) return "未分配";
      return `${teamName(owner)} 的题`;
    }

    function setStage(stage) {
      state.stage = stage;
      saveState();
      closeTimer();
      ui.modal = null;
      ui.activeCell = null;
      if (stage === "jeopardy" && !state.teams) {
        ui.teamDraft = createTeamDraft();
        ui.modal = "teamSetup";
      }
      render();
    }

    function openParticipantModal(id = null) {
      ui.modal = "participant";
      ui.editingParticipantId = id;
      closeTimer();
      render();
      setTimeout(() => document.getElementById("nickname")?.focus(), 0);
    }

    function submitParticipant(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const nickname = form.nickname.value.trim();
      if (!nickname) return;

      const duplicate = state.participants.some((person) =>
        person.nickname.trim().toLowerCase() === nickname.toLowerCase() &&
        person.id !== ui.editingParticipantId
      );
      if (duplicate && !confirm("这个 nickname 已经存在，仍然继续吗？")) return;

      if (ui.editingParticipantId) {
        const person = participantById(ui.editingParticipantId);
        if (person) person.nickname = nickname;
      } else {
        const id = uid();
        state.participants.push({ id, nickname, createdAt: Date.now() });
        const teamChoice = form.teamChoice?.value;
        if (state.teams && (teamChoice === "A" || teamChoice === "B")) {
          state.teams[teamChoice].memberIds.push(id);
          if (state.currentTeam === teamChoice && !state.currentPickerId) {
            state.currentPickerId = choosePicker(teamChoice);
          }
        }
      }

      saveState();
      if (ui.editingParticipantId) {
        closeModal();
      } else {
        renderInsideModal();
        setTimeout(() => document.getElementById("nickname")?.focus(), 0);
      }
    }

    function deleteParticipant(id) {
      const person = participantById(id);
      if (!person) return;
      if (!confirm(`确定删除 ${person.nickname} 吗？`)) return;

      state.participants = state.participants.filter((item) => item.id !== id);
      if (state.seating) {
        state.seating.orderIds = state.seating.orderIds.filter((item) => item !== id);
      }
      if (state.teams) {
        for (const teamId of ["A", "B"]) {
          state.teams[teamId].memberIds = state.teams[teamId].memberIds.filter((item) => item !== id);
        }
      }
      delete state.pickerCounts[id];
      if (state.currentPickerId === id) {
        state.currentPickerId = choosePicker(state.currentTeam);
      }
      saveState();
      render();
    }

    function resetActivity() {
      if (!confirm("确定重置整场活动吗？所有人员、分组、分数和翻牌进度都会清空。")) return;
      closeTimer();
      state = defaultState();
      localStorage.removeItem(STORAGE_KEY);
      ui = {
        modal: null,
        editingParticipantId: null,
        activeCell: null,
        activeCategoryId: null,
        activeTeamId: null,
        teamDraft: null,
        timer: null,
        justRevealed: null,
        scoreFlashTeam: null,
        stableModalRender: false,
        spotlight: null
      };
      render();
    }

    function assignSeats() {
      if (state.participants.length === 0) {
        alert("请先添加人员。");
        return;
      }
      state.seating = {
        orderIds: shuffle(state.participants.map((person) => person.id)),
        generatedAt: Date.now()
      };
      saveState();
      render();
    }

    function openTeamSetup(force = false) {
      if (state.teams && !confirm("已经有分组了，要重新随机分组吗？这会保留人员名单，但清空队伍分数和 Jeopardy 翻牌进度。")) return;
      ui.teamDraft = createTeamDraft();
      ui.modal = "teamSetup";
      closeTimer();
      render();
    }

    function createTeamDraft() {
      const ids = shuffle(state.participants.map((person) => person.id));
      return {
        A: ids.filter((_, index) => index % 2 === 0),
        B: ids.filter((_, index) => index % 2 === 1)
      };
    }

    function randomizeTeamDraft() {
      ui.teamDraft = createTeamDraft();
      render();
    }

    function confirmTeams() {
      if (!ui.teamDraft) ui.teamDraft = createTeamDraft();
      const aName = document.getElementById("teamNameA")?.value.trim() || "A队";
      const bName = document.getElementById("teamNameB")?.value.trim() || "B队";

      state.teams = {
        A: { id: "A", name: aName, memberIds: [...ui.teamDraft.A], score: 0 },
        B: { id: "B", name: bName, memberIds: [...ui.teamDraft.B], score: 0 }
      };
      state.currentTeam = "A";
      state.currentPickerId = choosePicker("A");
      state.board = {};
      saveState();
      closeModal();
    }

    function choosePicker(teamId) {
      const ids = teamMembers(teamId).map((person) => person.id);
      if (!ids.length) return null;
      const counts = state.pickerCounts || {};
      const min = Math.min(...ids.map((id) => counts[id] || 0));
      const candidates = ids.filter((id) => (counts[id] || 0) === min);
      const chosen = candidates[Math.floor(Math.random() * candidates.length)];
      counts[chosen] = (counts[chosen] || 0) + 1;
      state.pickerCounts = counts;
      return chosen;
    }

    function openCategoryModal(categoryId) {
      ui.modal = "category";
      ui.activeCategoryId = categoryId;
      closeTimer();
      render();
    }

    function openTeamModal(teamId) {
      ui.modal = "team";
      ui.activeTeamId = teamId;
      closeTimer();
      render();
    }

    function addScore(teamId, delta, flash = false) {
      if (!state.teams?.[teamId]) return;
      state.teams[teamId].score += delta;
      if (flash) {
        ui.scoreFlashTeam = teamId;
      }
      saveState();
      if (ui.modal) renderInsideModal();
      else render();
      if (flash) ui.scoreFlashTeam = null;
    }

    function openCell(categoryId, value) {
      if (!state.teams) {
        openTeamSetup(true);
        return;
      }
      ui.activeCell = { categoryId, value: Number(value) };
      ui.modal = "cell";
      ui.justRevealed = null;
      ui.scoreFlashTeam = null;
      resetTimerState(categoryId, value);
      render();
    }

    function revealCard(index) {
      if (!ui.activeCell) return;
      const { categoryId, value } = ui.activeCell;
      const fullCell = getCell(categoryId, value);
      const helper = fullCell.helpers[String(index)] || {};
      if (needsPreRevealHelper(categoryId) && !helperReady(categoryId, helper)) {
        alert("请先完成这张卡片的随机抽人。");
        return;
      }
      const cell = ensureCell(categoryId, value);
      if (cell.revealed[index]) return;

      const category = categoryById(categoryId);
      const shared = isSharedCell(category, value);
      const revealedCount = cell.revealed.filter(Boolean).length;
      cell.revealed[index] = true;
      cell.concealed[index] = false;
      cell.cardOwners[index] = shared
        ? "shared"
        : revealedCount === 0
          ? state.currentTeam
          : otherTeam(state.currentTeam);
      if (fullCell.cardOwners[index]) {
        cell.cardOwners[index] = fullCell.cardOwners[index];
      }
      ui.justRevealed = `${cellKey(categoryId, value)}:${index}`;
      saveState();
      renderInsideModal();
      ui.justRevealed = null;
    }

    function finishCell() {
      if (!ui.activeCell) return;
      const { categoryId, value } = ui.activeCell;
      const cell = ensureCell(categoryId, value);
      if (cell.completed) {
        closeModal();
        return;
      }
      if (!cell.revealed.every(Boolean)) return;

      cell.completed = true;
      state.currentTeam = otherTeam(state.currentTeam);
      state.currentPickerId = choosePicker(state.currentTeam);
      const nextTeamName = teamName(state.currentTeam);
      const nextPickerName = participantName(state.currentPickerId);
      saveState();
      closeModal();
      showSpotlight("下一位选题人", nextPickerName, [nextTeamName]);
    }

    function helperOwner(index) {
      if (!ui.activeCell) return null;
      const cell = getCell(ui.activeCell.categoryId, ui.activeCell.value);
      return predictedOwner(cell, index);
    }

    function updateHelper(index, updater) {
      if (!ui.activeCell) return;
      const fullCell = getCell(ui.activeCell.categoryId, ui.activeCell.value);
      const cell = ensureCell(ui.activeCell.categoryId, ui.activeCell.value);
      const key = String(index);
      if (!cell.cardOwners[index]) {
        cell.cardOwners[index] = predictedOwner(fullCell, index);
      }
      cell.helpers[key] = cell.helpers[key] || {};
      updater(cell.helpers[key]);
      saveState();
      renderInsideModal();
    }

    function pickFromOwner(index, count) {
      const owner = helperOwner(index);
      const ids = teamMembers(owner).map((person) => person.id);
      if (ids.length < count) {
        alert(`这个队伍至少需要 ${count} 人才能随机。`);
        return null;
      }
      return shuffle(ids).slice(0, count);
    }

    function drawTeammatePair(index) {
      const picked = pickFromOwner(index, 2);
      if (!picked) return;
      updateHelper(index, (helper) => {
        helper.pair = picked;
      });
      showSpotlight("队友了解", "随机结果", [
        `回答者：${participantName(picked[0])}`,
        `被了解者：${participantName(picked[1])}`
      ]);
    }

    function drawDescriber(index) {
      const picked = pickFromOwner(index, 1);
      if (!picked) return;
      updateHelper(index, (helper) => {
        helper.describer = picked[0];
      });
      showSpotlight("禁词描述", participantName(picked[0]), ["描述者"]);
    }

    function drawStarter(index) {
      const picked = pickFromOwner(index, 1);
      if (!picked) return;
      updateHelper(index, (helper) => {
        helper.starter = picked[0];
      });
      showSpotlight("限时说出", participantName(picked[0]), ["起始人"]);
    }

    function drawStoryRoles(index) {
      const picked = pickFromOwner(index, 3);
      if (!picked) return;
      updateHelper(index, (helper) => {
        helper.roles = { five: picked[0], three: picked[1], two: picked[2] };
      });
      showSpotlight("五三二圣经故事", "随机分工", [
        `5字：${participantName(picked[0])}`,
        `3字：${participantName(picked[1])}`,
        `2字：${participantName(picked[2])}`
      ]);
    }

    function toggleConceal(index) {
      if (!ui.activeCell) return;
      const cell = ensureCell(ui.activeCell.categoryId, ui.activeCell.value);
      if (!cell.revealed[index]) return;
      cell.concealed[index] = !cell.concealed[index];
      saveState();
      renderInsideModal();
    }

    function resetTimerState(categoryId, value) {
      closeTimer();
      const duration = getDuration(categoryId, value);
      if (!duration) {
        ui.timer = null;
        return;
      }
      ui.timer = {
        key: cellKey(categoryId, value),
        duration,
        remaining: duration,
        running: false,
        handle: null
      };
    }

    function startTimer() {
      if (!ui.timer || ui.timer.running) return;
      ui.timer.running = true;
      ui.timer.handle = setInterval(() => {
        if (!ui.timer) return;
        ui.timer.remaining = Math.max(0, ui.timer.remaining - 1);
        if (ui.timer.remaining === 0) {
          pauseTimer(false);
        }
        updateTimerDisplay();
      }, 1000);
      renderInsideModal();
    }

    function updateTimerDisplay() {
      const el = document.querySelector("[data-timer-time]");
      if (el && ui.timer) el.textContent = formatTime(ui.timer.remaining);
    }

    function pauseTimer(shouldRender = true) {
      if (!ui.timer) return;
      if (ui.timer.handle) clearInterval(ui.timer.handle);
      ui.timer.handle = null;
      ui.timer.running = false;
      if (shouldRender) renderInsideModal();
    }

    function resetTimer() {
      if (!ui.timer) return;
      pauseTimer(false);
      ui.timer.remaining = ui.timer.duration;
      renderInsideModal();
    }

    function closeTimer() {
      if (ui.timer?.handle) clearInterval(ui.timer.handle);
      ui.timer = null;
    }

    function closeModal() {
      closeTimer();
      ui.modal = null;
      ui.editingParticipantId = null;
      ui.activeCell = null;
      ui.activeCategoryId = null;
      ui.activeTeamId = null;
      ui.justRevealed = null;
      ui.scoreFlashTeam = null;
      render();
    }

    window.setStage = setStage;
    window.openParticipantModal = openParticipantModal;
    window.submitParticipant = submitParticipant;
    window.deleteParticipant = deleteParticipant;
    window.resetActivity = resetActivity;
    window.assignSeats = assignSeats;
    window.openTeamSetup = openTeamSetup;
    window.randomizeTeamDraft = randomizeTeamDraft;
    window.confirmTeams = confirmTeams;
    window.openCategoryModal = openCategoryModal;
    window.openTeamModal = openTeamModal;
    window.addScore = addScore;
    window.openCell = openCell;
    window.revealCard = revealCard;
    window.finishCell = finishCell;
    window.drawTeammatePair = drawTeammatePair;
    window.drawDescriber = drawDescriber;
    window.drawStarter = drawStarter;
    window.drawStoryRoles = drawStoryRoles;
    window.toggleConceal = toggleConceal;
    window.startTimer = startTimer;
    window.pauseTimer = pauseTimer;
    window.resetTimer = resetTimer;
    window.closeModal = closeModal;

    render();
  </script>
</body>
</html>
