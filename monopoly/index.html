  <!-- 游戏题目选择弹窗 -->
  <div class="task-modal" id="gameQuestionModal">
    <div class="task-content">
      <h3>选择线下游戏</h3>
      <p>请选择要进行的线下游戏类型</p>
      <div
        style="
          margin: 20px 0;
          display: flex;
          flex-direction: column;
          gap: 15px;
        ">
        <button class="button" onclick="selectGameType('emoji')"
          >🎯 看图识字</button
        >
        <button class="button" onclick="selectGameType('charades')"
          >🎭 你比划我猜</button
        >
        <button class="button" onclick="selectGameType('bible')"
          >📖 圣经问题</button
        >
        <button class="button" onclick="selectGameType('spiritual')"
          >🙏 属灵问题</button

    </div>

      <div id="questionContent" style="margin: 20px 0; min-height: 100px"></div>

    <div class="container">
      <!-- 入口选择界面 -->
      <div class="screen active" id="welcomeScreen">
        <h1>🎲 教会团契大富翁</h1>
        <p style="margin-bottom: 30px; font-size: 18px">欢迎来到信仰之路！</p>
        <button class="button" onclick="showScreen('hostScreen')"
          >我是主持人</button
        >
        <button class="button" onclick="showScreen('playerRegisterScreen')"
          >我是玩家</button
        >
      </div>

      <!-- 玩家注册界面 -->
      <div class="screen" id="playerRegisterScreen">
        <h2>玩家注册</h2>
        <form id="playerForm">
          <div class="form-group">
            <label for="playerName">姓名：</label>
            <input type="text" id="playerName" required />
          </div>

          <div class="form-group">
            <label for="playerGender">性别：</label>
            <select id="playerGender" required>
              <option value="">请选择</option>
              <option value="男">男</option>
              <option value="女">女</option>
            </select>
          </div>

          <div class="form-group">
            <label for="playerAvatar">头像（可选）：</label>
            <input type="file" id="playerAvatar" accept="image/*" />
          </div>

          <div class="avatar-preview" id="avatarPreview"></div>

          <button type="submit" class="button">加入游戏</button>
          <button
            type="button"
            class="button"
            onclick="showScreen('welcomeScreen')"
            >返回</button
          >
        </form>
      </div>

      <!-- 玩家游戏界面 -->

        <h2 id="playerWelcome">欢迎，玩家！</h2>
        <div id="gameStatus" style="margin: 20px 0; font-size: 18px"

          <br />

          >
          <button
            class="button"
            id="viewTaskBtn"
            onclick="reopenTask()"
            style="display: none"
            >查看当前任务</button
          >
        </div>

        <button class="button" onclick="showScreen('welcomeScreen')"
          >离开游戏</button

          <button class="button" id="startGameBtn" onclick="startGame()"

    <script>
      // 公开仓库不内置 LeanCloud 配置；运行时保存在当前浏览器 localStorage。
      const CONFIG_STORAGE_KEY = "faith-monopoly:leancloud-config";
      const LOCAL_BACKEND_STORAGE_KEY = "faith-monopoly:local-backend:v1";
      const leanCloudConfig = loadLeanCloudConfig();
      const APP_ID = leanCloudConfig.appId;
      const APP_KEY = leanCloudConfig.appKey;
      const SERVER_URL = leanCloudConfig.serverURL;

      function loadLeanCloudConfig() {
        const query = new URLSearchParams(window.location.search);
        const queryConfig = {
          appId: query.get("appId") || "",
          appKey: query.get("appKey") || "",
          serverURL: query.get("serverUrl") || query.get("serverURL") || "",
        };

        const embeddedConfig = window.FAITH_MONOPOLY_CONFIG || {};
        const storedConfig = getStoredLeanCloudConfig();

        return {
          appId:
            embeddedConfig.appId || queryConfig.appId || storedConfig.appId || "",
          appKey:
            embeddedConfig.appKey || queryConfig.appKey || storedConfig.appKey || "",
          serverURL:
            embeddedConfig.serverURL ||
            queryConfig.serverURL ||
            storedConfig.serverURL ||
            "",
        };
      }

      function getStoredLeanCloudConfig() {
        try {
          return JSON.parse(localStorage.getItem(CONFIG_STORAGE_KEY) || "{}");
        } catch (error) {
          return {};
        }
      }

      function hasLeanCloudConfig() {
        return Boolean(APP_ID && APP_KEY && SERVER_URL);
      }

      function showLeanCloudConfigScreen() {
        document.body.innerHTML = `
          <div style="max-width: 520px; margin: 48px auto; padding: 28px; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #253047;">
            <h1 style="font-size: 24px; margin-bottom: 12px;">需要配置 LeanCloud</h1>
            <p style="line-height: 1.7; color: #596273;">公开版本不会内置任何后端 App ID 或 App Key。请填入你自己的 LeanCloud 应用配置，它只会保存在当前浏览器。</p>
            <form id="leanCloudConfigForm" style="display: grid; gap: 14px; margin-top: 22px;">
              <label style="display: grid; gap: 6px; font-weight: 600;">
                App ID
                <input id="runtimeAppId" autocomplete="off" required style="padding: 10px 12px; border: 1px solid #cfd6e4; border-radius: 8px; font: inherit;">
              </label>
              <label style="display: grid; gap: 6px; font-weight: 600;">
                App Key
                <input id="runtimeAppKey" autocomplete="off" required style="padding: 10px 12px; border: 1px solid #cfd6e4; border-radius: 8px; font: inherit;">
              </label>
              <label style="display: grid; gap: 6px; font-weight: 600;">
                Server URL
                <input id="runtimeServerUrl" type="url" autocomplete="off" required placeholder="https://..." style="padding: 10px 12px; border: 1px solid #cfd6e4; border-radius: 8px; font: inherit;">
              </label>
              <button type="submit" style="padding: 12px 16px; border: 0; border-radius: 8px; background: #3d6dd8; color: white; font-weight: 700; cursor: pointer;">保存并进入游戏</button>
            </form>
          </div>
        `;

        document
          .getElementById("leanCloudConfigForm")
          .addEventListener("submit", (event) => {
            event.preventDefault();
            const config = {
              appId: document.getElementById("runtimeAppId").value.trim(),
              appKey: document.getElementById("runtimeAppKey").value.trim(),
              serverURL: document.getElementById("runtimeServerUrl").value.trim(),
            };
            localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify(config));
            window.location.reload();
          });
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function safeImageSrc(value) {
        const source = String(value || "").trim();
        if (/^data:image\/(?:png|jpe?g|gif|webp);base64,[a-z0-9+/=]+$/i.test(source)) {
          return source;
        }

        try {
          const url = new URL(source, window.location.href);
          return url.protocol === "https:" ? url.href : "";
        } catch (error) {
          return "";
        }
      }

      function safeColor(value, fallback = "#667eea") {
        const color = String(value || "").trim();
        return /^#[0-9a-f]{3,8}$/i.test(color) ? color : fallback;
      }

      function safePlayerName(player) {
        return escapeHtml(player?.get("name") || "未命名玩家");
      }

      function safeAvatarStyle(player) {
        const imageUrl = safeImageSrc(player?.get("avatar"));
        if (imageUrl) {
          return `background-image: url('${imageUrl.replace(/'/g, "%27")}')`;
        }
        return `background-color: ${safeColor(player?.get("avatarColor"))}`;
      }

      function safeAvatarText(player) {
        return safeImageSrc(player?.get("avatar"))
          ? ""
          : escapeHtml(player?.get("avatarInitial") || "");
      }

      function setupLocalBackend() {
        const db = loadLocalBackendDb();
        let changed = false;

        function persist() {
          if (!changed) return;
          localStorage.setItem(
            LOCAL_BACKEND_STORAGE_KEY,
            JSON.stringify(encodeLocalValue(db))
          );
          changed = false;
        }

        function ensureClass(className) {
          if (!db[className]) {
            db[className] = {};
            changed = true;
          }
          if (!db._seq[className]) {
            db._seq[className] = 0;
            changed = true;
          }
        }

        function cloneFields(fields) {
          return decodeLocalValue(encodeLocalValue(fields || {}));
        }

        class LocalObject {
          constructor(className, id = null, fields = {}) {
            this.className = className;
            this.id = id;
            this.attributes = cloneFields(fields);
          }

          get(key) {
            return this.attributes[key];
          }

          set(key, value) {
            this.attributes[key] = value;
          }

          async save() {
            ensureClass(this.className);
            if (!this.id) {
              db._seq[this.className] += 1;
              this.id = `local-${this.className}-${db._seq[this.className]}`;
            }
            db[this.className][this.id] = cloneFields(this.attributes);
            changed = true;
            persist();
            return this;
          }

          async destroy() {
            ensureClass(this.className);
            if (this.id && db[this.className][this.id]) {
              delete db[this.className][this.id];
              changed = true;
              persist();
            }
          }
        }

        class LocalQuery {
          constructor(Model) {
            this.className = Model.className;
            this.filters = [];
          }

          equalTo(field, expectedValue) {
            this.filters.push({ field, expectedValue });
            return this;
          }

          async find() {
            ensureClass(this.className);
            persist();
            return Object.entries(db[this.className])
              .map(([id, fields]) => new LocalObject(this.className, id, fields))
              .filter((record) =>
                this.filters.every(
                  ({ field, expectedValue }) => record.get(field) === expectedValue
                )
              );
          }

          async first() {
            const records = await this.find();
            return records[0] || null;
          }
        }

        window.AV = {
          init() {},
          Object: {
            extend(className) {
              ensureClass(className);
              class TypedLocalObject extends LocalObject {
                constructor() {
                  super(className);
                }
              }
              TypedLocalObject.className = className;
              persist();
              return TypedLocalObject;
            },
            async destroyAll(records) {
              await Promise.all((records || []).map((record) => record.destroy()));
            },
          },
          Query: LocalQuery,
          File: class LocalFile {
            constructor(name, data) {
              this.name = name;
              this.data = data || {};
              this.savedUrl = "";
            }

            async save() {
              const extension = this.name.split(".").pop().toLowerCase();
              const mimeType = extension === "jpg" || extension === "jpeg"
                ? "image/jpeg"
                : extension === "webp"
                ? "image/webp"
                : "image/png";
              this.savedUrl = `data:${mimeType};base64,${this.data.base64 || ""}`;
              return this;
            }

            url() {
              return this.savedUrl;
            }
          },
        };

        return window.AV;
      }

      function loadLocalBackendDb() {
        try {
          const parsed = JSON.parse(
            localStorage.getItem(LOCAL_BACKEND_STORAGE_KEY) || "{}"
          );
          const decoded = decodeLocalValue(parsed);
          return {
            _seq: decoded._seq || {},
            Player: decoded.Player || {},
            GameState: decoded.GameState || {},
            Submission: decoded.Submission || {},
          };
        } catch (error) {
          return { _seq: {}, Player: {}, GameState: {}, Submission: {} };
        }
      }

      function encodeLocalValue(value) {
        if (value instanceof Date) {
          return { __type: "Date", iso: value.toISOString() };
        }
        if (Array.isArray(value)) {
          return value.map((item) => encodeLocalValue(item));
        }
        if (value && typeof value === "object") {
          return Object.fromEntries(
            Object.entries(value).map(([key, item]) => [key, encodeLocalValue(item)])
          );
        }
        return value;
      }

      function decodeLocalValue(value) {
        if (value && value.__type === "Date" && value.iso) {
          return new Date(value.iso);
        }
        if (Array.isArray(value)) {
          return value.map((item) => decodeLocalValue(item));
        }
        if (value && typeof value === "object") {
          return Object.fromEntries(
            Object.entries(value).map(([key, item]) => [key, decodeLocalValue(item)])
          );
        }
        return value;
      }

      function showRuntimeModeNotice(mode) {
        if (mode !== "local") return;

        const container = document.querySelector(".container");
        if (!container || document.getElementById("runtimeModeNotice")) return;

        const notice = document.createElement("div");
        notice.id = "runtimeModeNotice";
        notice.style.cssText =
          "margin:0 0 16px;padding:12px 14px;border-radius:10px;background:#fff8e1;color:#5d4037;border:1px solid #ffe0a3;font-size:14px;line-height:1.6;text-align:left;";
        notice.textContent =
          "公开版默认本地模式：数据只保存在当前浏览器。多人同步是我主动关掉的，因为公开仓库不内置 LeanCloud 配置，不是功能没写好。";
        container.prepend(notice);
      }

      }; // 获取玩家小人emoji
      function getPlayerFigure(gender) {
        return gender === "男" ? "🧑‍💼" : "👩‍💼";
      }

      // 随机选择朋友
      function selectRandomFriend(requireSameGender = false) {
        if (!currentPlayer || !players || players.length <= 1) {
          return null;
        }

        // 过滤掉当前玩家
        let availablePlayers = players.filter((p) => p.id !== currentPlayer.id);

        if (requireSameGender) {
          // 如果需要相同性别，进一步过滤
          const currentGender = currentPlayer.get("gender");
          availablePlayers = availablePlayers.filter(
            (p) => p.get("gender") === currentGender
          );
        }

        if (availablePlayers.length === 0) {
          return null;
        }

        // 随机选择一个玩家
        const randomIndex = Math.floor(Math.random() * availablePlayers.length);
        return availablePlayers[randomIndex];
      }

      // 检查任务是否需要朋友
      function taskNeedsFriend(position) {
        const friendTasks = [5, 12, 16, 22]; // 需要朋友的任务格子
        return friendTasks.includes(position);
      }

      // 检查任务是否需要相同性别的朋友
      function taskNeedsSameGender(position) {
        return position === 16; // 拥抱任务需要相同性别
      }

      // 检查任务是否需要等待其他玩家
      function taskNeedsWaiting(position) {
        return position === 6 || position === 20; // 你比划我猜 和 合作拼积木
      }

      // 获取等待任务的描述
      function getWaitingTaskDescription(position) {
        if (position === 6) {
          return {
            title: "🎭 等待游戏伙伴",
            description:
              "你比划我猜需要两个人才能进行，正在等待另一位玩家到达这个格子...",
          };
        } else if (position === 20) {
          return {
            title: "🧩 等待合作伙伴",
            description:
              "合作拼积木需要两个人配合，正在等待另一位玩家到达这个格子...",
          };
        }
        return { title: "⏳ 等待中", description: "等待其他玩家..." };
      }

      // 检测是否有其他玩家在相同位置
      function getPlayersAtPosition(position) {
        if (!players || !currentPlayer) return [];

        const completedPlayerIds = window.completedTasks[position] || [];

        // 获取所有在此位置且未完成任务的玩家（包括当前玩家）
        const allPlayersAtPosition = players.filter(
          (player) =>
            player.get("position") === position &&
            !completedPlayerIds.includes(player.id)
        );

        // 如果不是等待任务，返回原逻辑
        if (!taskNeedsWaiting(position)) {
          return allPlayersAtPosition.filter(
            (player) => player.id !== currentPlayer.id
          );
        }

        // 等待任务的配对逻辑
        // 按到达时间排序
        allPlayersAtPosition.sort((a, b) => {
          const timeA = a.get(`arrivalTime_${position}`) || new Date(0);
          const timeB = b.get(`arrivalTime_${position}`) || new Date(0);
          return timeA.getTime() - timeB.getTime();
        });

        // 找到当前玩家在排序中的位置
        const currentPlayerIndex = allPlayersAtPosition.findIndex(
          (player) => player.id === currentPlayer.id
        );

        if (currentPlayerIndex === -1) return [];

        // 配对逻辑：每两个玩家为一组
        const pairIndex = Math.floor(currentPlayerIndex / 2);
        const pairStartIndex = pairIndex * 2;

        // 获取当前玩家的配对伙伴
        const currentPair = allPlayersAtPosition.slice(
          pairStartIndex,
          pairStartIndex + 2
        );

        // 如果配对不完整（只有1个玩家），返回空数组表示需要等待
        if (currentPair.length < 2) {
          return [];
        }

        // 返回配对中的另一个玩家
        return currentPair.filter((player) => player.id !== currentPlayer.id);
      }

      // 检测是否所有其他玩家都已经超过了指定位置
      function allOtherPlayersPassed(position) {
        if (!players || !currentPlayer) return false;

        const otherPlayers = players.filter(
          (player) => player.id !== currentPlayer.id
        );
        if (otherPlayers.length === 0) return true;

        // 检查是否所有其他玩家的位置都大于当前位置
        return otherPlayers.every(
          (player) => player.get("position") > position
        );
      }

      // 继续单独游戏
      function continueAlone() {
        if (!currentTask) return;

        // 直接完成任务，不需要提交内容
        currentTask = null;

        // 重新启用掷色子按钮

        ) {

        }
        document.getElementById("viewTaskBtn").style.display = "none";
      }

      // 初始化应用
      function initializeApp() {
        if (new URLSearchParams(window.location.search).get("setupLeanCloud") === "1") {
          showLeanCloudConfigScreen();
          return;
        }

        if (!hasLeanCloudConfig()) {
          setupLocalBackend();
          Player = AV.Object.extend("Player");
          GameState = AV.Object.extend("GameState");
          Submission = AV.Object.extend("Submission");
          showRuntimeModeNotice("local");
          console.log("本地模式初始化成功");
          return;
        }

        if (typeof AV === "undefined") {
          setTimeout(initializeApp, 100);
          return;
        }

        try {
          AV.init({
            appId: APP_ID,
            appKey: APP_KEY,
            serverURL: SERVER_URL,
          });

          Player = AV.Object.extend("Player");
          GameState = AV.Object.extend("GameState");
          Submission = AV.Object.extend("Submission");

          console.log("LeanCloud 初始化成功");
        } catch (error) {
          console.error("LeanCloud 初始化失败:", error);
        }
      }

      function showScreen(screenId) {
        document.querySelectorAll(".screen").forEach((screen) => {
          screen.classList.remove("active");

        document.getElementById(screenId).classList.add("active");

        const container = document.querySelector(".container");
        if (screenId === "hostScreen" || screenId === "submissionsScreen") {
          container.classList.add("host");
          if (screenId === "hostScreen" && !isHost) {
            isHost = true;
            loadGameState();
            setInterval(loadGameState, 2000);

        } else {
          container.classList.remove("host");

      // 更新头像预览
      function updateAvatarPreview() {
        const name = document.getElementById("playerName").value;
        const preview = document.getElementById("avatarPreview");

        if (name) {
          const avatar = generateAvatar(name);

      // 头像文件处理
      function handleAvatarUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
          const img = document.getElementById("cropperImage");
          img.src = e.target.result;
          img.onload = function () {
            initAvatarCropper();
            document
              .getElementById("avatarCropperOverlay")
              .classList.add("active");
          };
        };
        reader.readAsDataURL(file);
      }

      // 初始化头像裁剪器
      function initAvatarCropper() {
        const img = document.getElementById("cropperImage");

        // 重置状态
        cropperState = {
          scale: 1,
          x: 0,
          y: 0,
          isDragging: false,
          startX: 0,
          startY: 0,
          lastTouchDistance: 0,
          isZooming: false,
        };

        // 计算初始缩放
        setTimeout(() => {
          calculateInitialScale();
        }, 100);

        // 添加拖拽事件
        img.addEventListener("mousedown", startDrag);
        img.addEventListener("touchstart", startDrag);
      }

      // 计算初始缩放
      function calculateInitialScale() {
        const img = document.getElementById("cropperImage");
        const container = img.parentElement;
        const containerRect = container.getBoundingClientRect();

        if (
          !img.naturalWidth ||
          !img.naturalHeight ||
          !containerRect.width ||
          !containerRect.height
        ) {
          setTimeout(calculateInitialScale, 50);
          return;
        }

        // 获取裁剪圆圈的大小（70vmin）
        const circleSize =
          Math.min(containerRect.width, containerRect.height) * 0.7;

        // 计算让图片完全覆盖圆圈所需的最小缩放
        const scaleX = circleSize / img.naturalWidth;
        const scaleY = circleSize / img.naturalHeight;

        // 使用较大的比例确保图片能完全覆盖圆圈
        cropperState.scale = Math.max(scaleX, scaleY, 0.1);

        console.log("Calculated scale:", cropperState.scale);
        updateImageTransform();
      }

      // 开始拖拽
      function startDrag(e) {
        e.preventDefault();

        if (e.type === "touchstart" && e.touches.length === 1) {
          cropperState.isDragging = true;
          cropperState.isZooming = false;
          const touch = e.touches[0];
          cropperState.startX = touch.clientX - cropperState.x;
          cropperState.startY = touch.clientY - cropperState.y;
        } else if (e.type === "touchstart" && e.touches.length === 2) {
          cropperState.isDragging = false;
          cropperState.isZooming = true;
          const touch1 = e.touches[0];
          const touch2 = e.touches[1];
          const distance = Math.sqrt(
            Math.pow(touch2.clientX - touch1.clientX, 2) +
              Math.pow(touch2.clientY - touch1.clientY, 2)
          );
          cropperState.lastTouchDistance = distance;
        } else if (e.type === "mousedown") {
          cropperState.isDragging = true;
          cropperState.isZooming = false;
          cropperState.startX = e.clientX - cropperState.x;
          cropperState.startY = e.clientY - cropperState.y;
        }

        document.addEventListener("mousemove", handleDrag);
        document.addEventListener("touchmove", handleDrag);
        document.addEventListener("mouseup", endDrag);
        document.addEventListener("touchend", endDrag);
      }

      // 处理拖拽和缩放
      function handleDrag(e) {
        e.preventDefault();

        if (
          e.type === "touchmove" &&
          e.touches.length === 1 &&
          cropperState.isDragging
        ) {
          const touch = e.touches[0];
          cropperState.x = touch.clientX - cropperState.startX;
          cropperState.y = touch.clientY - cropperState.startY;
          updateImageTransform();
        } else if (
          e.type === "touchmove" &&
          e.touches.length === 2 &&
          cropperState.isZooming
        ) {
          const touch1 = e.touches[0];
          const touch2 = e.touches[1];
          const distance = Math.sqrt(
            Math.pow(touch2.clientX - touch1.clientX, 2) +
              Math.pow(touch2.clientY - touch1.clientY, 2)
          );

          if (cropperState.lastTouchDistance > 0) {
            const scaleChange = distance / cropperState.lastTouchDistance;
            const newScale = cropperState.scale * scaleChange;
            cropperState.scale = Math.max(0.1, Math.min(newScale, 5));
            updateImageTransform();
          }

          cropperState.lastTouchDistance = distance;
        } else if (e.type === "mousemove" && cropperState.isDragging) {
          cropperState.x = e.clientX - cropperState.startX;
          cropperState.y = e.clientY - cropperState.startY;
          updateImageTransform();
        }
      }

      // 结束拖拽
      function endDrag(e) {
        if (e.type === "touchend" && e.touches.length === 0) {
          cropperState.isDragging = false;
          cropperState.isZooming = false;
          cropperState.lastTouchDistance = 0;
        } else if (e.type === "mouseup") {
          cropperState.isDragging = false;
        }

        if (e.type === "touchend" && e.touches.length > 0) {
          return;
        }

        document.removeEventListener("mousemove", handleDrag);
        document.removeEventListener("touchmove", handleDrag);
        document.removeEventListener("mouseup", endDrag);
        document.removeEventListener("touchend", endDrag);
      }

      // 更新图片变换
      function updateImageTransform() {
        const img = document.getElementById("cropperImage");
        img.style.transform = `translate(calc(-50% + ${cropperState.x}px), calc(-50% + ${cropperState.y}px)) scale(${cropperState.scale})`;
      }

      // 确认头像裁剪 - 修复偏移问题
      function confirmAvatarCrop() {
        const img = document.getElementById("cropperImage");
        const container = img.parentElement;

        // 创建canvas进行裁剪
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 200;
        canvas.height = 200;

        // 计算裁剪区域
        const containerRect = container.getBoundingClientRect();
        const circleSize =
          Math.min(containerRect.width, containerRect.height) * 0.7;
        const centerX = containerRect.width / 2;
        const centerY = containerRect.height / 2;

        // 计算圆圈在原始图片中的位置和大小
        const imageWidth = img.naturalWidth;
        const imageHeight = img.naturalHeight;
        const displayScale = cropperState.scale;

        // 图片在容器中的实际位置（考虑变换）
        const imgCenterX = centerX + cropperState.x;
        const imgCenterY = centerY + cropperState.y;

        // 裁剪圆圈在图片中的位置和大小
        const cropSize = circleSize / displayScale;
        const cropCenterX =
          (centerX - imgCenterX) / displayScale + imageWidth / 2;
        const cropCenterY =
          (centerY - imgCenterY) / displayScale + imageHeight / 2;

        const cropLeft = cropCenterX - cropSize / 2;
        const cropTop = cropCenterY - cropSize / 2;

        // 绘制圆形裁剪
        ctx.save();
        ctx.beginPath();
        ctx.arc(100, 100, 100, 0, Math.PI * 2);
        ctx.clip();

        // 从原图的指定区域绘制到canvas
        ctx.drawImage(
          img,
          cropLeft,
          cropTop,
          cropSize,
          cropSize, // 源区域
          0,
          0,
          200,
          200 // 目标区域
        );
        ctx.restore();

        const croppedDataURL = canvas.toDataURL("image/png", 0.9);
        avatarCropData = croppedDataURL;

        // 更新预览
        const preview = document.getElementById("avatarPreview");
        preview.style.backgroundImage = `url(${croppedDataURL})`;
        preview.style.backgroundSize = "cover";
        preview.style.backgroundPosition = "center";
        preview.textContent = "";

        document
          .getElementById("avatarCropperOverlay")
          .classList.remove("active");
      }

      // 取消头像裁剪
      function cancelAvatarCrop() {
        document
          .getElementById("avatarCropperOverlay")
          .classList.remove("active");
        document.getElementById("playerAvatar").value = "";
        avatarCropData = null;
        updateAvatarPreview();
      }

      // 加载游戏状态
      async function loadGameState() {
        try {
          const gameQuery = new AV.Query(GameState);
          const game = await gameQuery.first();

          if (game) {
            gameState = game;
            const isStarted = game.get("isStarted");
            const isEnded = game.get("isEnded");

            if (isEnded) {
              document.getElementById("gameStatus").textContent = "游戏已结束";
              const rollButton = document.getElementById("rollDiceBtn");
              if (rollButton) rollButton.disabled = true;
              document.getElementById("diceContainer").style.display = "block";
            } else if (isStarted) {
              document.getElementById("gameStatus").textContent = "游戏进行中";
              // 显示掷色子区域
              document.getElementById("diceContainer").style.display = "block";
              // 只有没有未完成任务时才启用掷色子按钮
              const rollButton = document.getElementById("rollDiceBtn");
              const viewTaskBtn = document.getElementById("viewTaskBtn");
              if (rollButton && !currentTask) {
                rollButton.disabled = false;
                viewTaskBtn.style.display = "none";
              } else if (currentTask) {
                rollButton.disabled = true;
                viewTaskBtn.style.display = "inline-block";
              }
            } else {
              document.getElementById("gameStatus").textContent =
                "等待游戏开始...";
              // 隐藏掷色子区域
              document.getElementById("diceContainer").style.display = "none";
            }
          } else {
            // 没有游戏状态，隐藏掷色子区域
            document.getElementById("diceContainer").style.display = "none";
          }

          // 加载所有玩家
          const playerQuery = new AV.Query(Player);
          players = await playerQuery.find();

          // 更新当前玩家信息
          if (currentPlayer) {
            const updatedPlayer = players.find(
              (p) => p.id === currentPlayer.id
            );
            if (updatedPlayer) {
              currentPlayer = updatedPlayer;
            }
          }

          // 加载任务完成状态 - 移到 try 块内，并添加错误处理
          try {
            const submissionQuery = new AV.Query(Submission);
            const allSubmissions = await submissionQuery.find();
            window.completedTasks = {}; // 存储每个位置已完成任务的玩家ID
            allSubmissions.forEach((sub) => {
              const pos = sub.get("position");
              if (!window.completedTasks[pos]) {
                window.completedTasks[pos] = [];
              }
              window.completedTasks[pos].push(sub.get("playerId"));
            });
          } catch (submissionError) {
            console.error("加载任务完成状态失败:", submissionError);
            // 如果加载失败，初始化为空对象，不影响游戏正常运行
            window.completedTasks = {};
          }

          // 检查是否有等待任务需要更新状态
          if (
            currentTask &&
            taskNeedsWaiting(currentTask.position) &&
            !isHost
          ) {
            checkWaitingTaskStatus();
          }
          if (!isAnimating) {
            if (!isHost) {
              updatePlayerBoard();
            } else {
              updateHostBoard();
              updatePlayersList();

              // 更新游戏信息显示
              const gameInfo = document.getElementById("gameInfo");
              gameInfo.innerHTML = `
              <p>当前玩家数量: ${players.length}</p>
              <p>游戏状态: ${
                gameState
                  ? gameState.get("isEnded")
                    ? "已结束"
                    : gameState.get("isStarted")
                    ? "进行中"
                    : "未开始"
                  : "未开始"
              }</p>
            `;
            }
          }
        } catch (error) {
          console.error("加载游戏状态失败:", error);
          // 即使出错也要确保界面能正常显示
          if (!isHost && players.length > 0) {
            updatePlayerBoard();
          } else if (isHost && players.length > 0) {
            updateHostBoard();
            updatePlayersList();
          }
        }
      }
      // 检查等待任务状态
      function checkWaitingTaskStatus() {
        if (!currentTask || !taskNeedsWaiting(currentTask.position)) return;

        const position = currentTask.position;
        const playersAtSamePosition = getPlayersAtPosition(position);
        const allPlayersPassed = allOtherPlayersPassed(position);

        // 检查当前任务模态框是否打开
        const taskModal = document.getElementById("taskModal");
        const isModalOpen = taskModal.classList.contains("active");

        if (playersAtSamePosition.length > 0) {
          // 有其他玩家到达了相同位置
          if (isModalOpen) {
            // 更新模态框内容为协作任务
            showCollaborativeTask(position, playersAtSamePosition);
          }
        } else if (allPlayersPassed) {
          // 所有其他玩家都已经超过了这个位置
          if (isModalOpen) {
            // 更新模态框内容，显示可以继续的选项
            showWaitingTaskWithContinueOption(position);
          }
        }
        // 如果仍在等待状态，不需要更新界面
      }

        const editingStates = {};

        list.querySelectorAll(".position-input").forEach((input) => {

            isFocused: input === currentFocus,
          };

          }

          let game = gameState;
          if (!game) {
            game = new GameState();

          game.set("isStarted", true);
          game.set("isEnded", false);
          await game.save();

          document.getElementById("startGameBtn").disabled = true;
          document.getElementById("endGameBtn").disabled = false;

          if (gameState) {

          }

        } catch (error) {

      // 掷骰子
      async function rollDice() {
        const diceElement = document.getElementById("diceResult");
        const rollButton = document.getElementById("rollDiceBtn");

        rollButton.disabled = true;
        diceElement.classList.add("rolling");

        const animationDuration = 1000;
        const intervalTime = 100;
        const intervals = animationDuration / intervalTime;
        let counter = 0;

        const animationInterval = setInterval(() => {
          diceElement.textContent = Math.floor(Math.random() * 3) + 1;
          counter++;

          if (counter >= intervals) {
            clearInterval(animationInterval);
            const finalResult = Math.floor(Math.random() * 3) + 1;
            diceElement.textContent = finalResult;
            diceElement.classList.remove("rolling");
            movePlayer(finalResult);
          }
        }, intervalTime);
      }

      // 移动玩家 - 添加动画效果
      async function movePlayer(steps) {
        isAnimating = true;
        const oldPosition = currentPlayer.get("position");
        const newPosition = Math.min(31, oldPosition + steps);

        console.log(
          `移动玩家从 ${oldPosition} 到 ${newPosition}，共 ${steps} 步`
        );

        // 逐步移动动画
        let currentStep = 0;
        const moveStep = () => {
          if (currentStep < steps && oldPosition + currentStep < 31) {
            currentStep++;
            const intermediatePosition = oldPosition + currentStep;

            console.log(
              `执行第 ${currentStep} 步移动到位置 ${intermediatePosition}`
            );

            // 临时更新位置显示动画
            movePlayerAvatar(
              oldPosition + currentStep - 1,
              intermediatePosition
            );

            setTimeout(() => {
              if (currentStep < steps && oldPosition + currentStep < 31) {
                moveStep();
              } else {
                // 最终保存位置
                finalizeMovePlayer(newPosition);
              }
            }, 500); // 每步500ms
          } else {
            finalizeMovePlayer(newPosition);
          }
        };

        moveStep();
      }

      // 头像和小人移动动画
      function movePlayerAvatar(fromPos, toPos) {
        // 找到当前玩家的头像容器
        const fromCell = document.getElementById(`cell-${fromPos}`);
        const toCell = document.getElementById(`cell-${toPos}`);

        if (!fromCell || !toCell) {
          console.log("找不到格子:", fromPos, toPos);
          return;
        }

        const fromPlayersDiv = fromCell.querySelector(".players-on-cell");
        if (!fromPlayersDiv) {
          console.log("找不到玩家容器:", fromPos);
          return;
        }

        // 查找当前玩家的容器
        let playerContainer = null;
        const containers = fromPlayersDiv.querySelectorAll(".player-container");

        for (let container of containers) {
          const avatar = container.querySelector(".player-avatar");
          const figure = container.querySelector(".player-figure");

          // 检查是否有小人（只有当前玩家才有）
          if (figure) {
            playerContainer = container;
            break;
          }
        }

        if (playerContainer) {
          console.log("找到玩家容器，开始移动动画");

          // 添加移动效果
          const avatar = playerContainer.querySelector(".player-avatar");
          const figure = playerContainer.querySelector(".player-figure");

          if (avatar) avatar.classList.add("moving");
          if (figure) figure.classList.add("moving");

          // 移动到新位置
          let toPlayersDiv = toCell.querySelector(".players-on-cell");
          if (!toPlayersDiv) {
            toPlayersDiv = document.createElement("div");
            toPlayersDiv.className = "players-on-cell";
            toCell.appendChild(toPlayersDiv);
          }

          // 克隆整个容器到新位置
          const newContainer = playerContainer.cloneNode(true);
          toPlayersDiv.appendChild(newContainer);

          // 移除原位置的容器
          playerContainer.remove();

          // 清理空的容器
          if (fromPlayersDiv.children.length === 0) {
            fromPlayersDiv.remove();
          }

          // 移除移动效果
          setTimeout(() => {
            const newAvatar = newContainer.querySelector(".player-avatar");
            const newFigure = newContainer.querySelector(".player-figure");

            if (newAvatar) newAvatar.classList.remove("moving");
            if (newFigure) newFigure.classList.remove("moving");
          }, 600);

          // 滚动到当前位置
          setTimeout(() => {
            scrollToCurrentPlayer(toPos);
          }, 100);
        } else {
          console.log("找不到当前玩家的容器");
        }
      }

      // 修改finalizeMovePlayer函数中的任务调用
      async function finalizeMovePlayer(newPosition) {
        currentPlayer.set("position", newPosition);

        try {
          await currentPlayer.save();

          if (taskNeedsWaiting(newPosition)) {
            // 记录到达时间戳
            currentPlayer.set(`arrivalTime_${newPosition}`, new Date());
            await currentPlayer.save();
          }

          // 检查是否有任务 - 改为调用showTaskPreview
          if (tasks[newPosition]) {
            setTimeout(() => {

            }, 800);
          } else {
            // 没有任务时重新启用掷色子按钮（仅在游戏进行中）
            const rollButton = document.getElementById("rollDiceBtn");
            if (
              rollButton &&
              gameState &&
              gameState.get("isStarted") &&
              !gameState.get("isEnded")
            ) {
              rollButton.disabled = false;
            }
          }
          // 检查是否到达终点
          if (newPosition === 31) {
            setTimeout(() => {
              showFireworks();
            }, 1500);
          }
        } catch (error) {
          console.error("保存位置失败:", error);
          document.getElementById("rollDiceBtn").disabled = false;
        }
      }

      // 倒计时功能
      function startCountdown(seconds) {
        const display = document.getElementById("countdownDisplay");
        if (!display) return;

        // 清除之前的倒计时
        if (countdownInterval) {
          clearInterval(countdownInterval);
        }

        let remainingTime = seconds;

        // 立即更新一次显示
        updateCountdownDisplay(remainingTime, display);

        countdownInterval = setInterval(() => {
          remainingTime--;
          updateCountdownDisplay(remainingTime, display);

          if (remainingTime < 0) {
            clearInterval(countdownInterval);
            display.textContent = "🎉 等待时间结束！";
            display.classList.add("finished");
            document.getElementById("completeTaskBtn").disabled = false;
          }
        }, 1000);
      }

      function updateCountdownDisplay(seconds, display) {
        if (seconds < 0) return;

        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        const timeString = `${minutes}:${secs.toString().padStart(2, "0")}`;

        if (seconds > 60) {
          display.textContent = `⏰ 请等待 ${timeString}`;
        } else if (seconds > 10) {
          display.textContent = `⏰ 还剩 ${timeString}`;
        } else if (seconds > 0) {
          display.textContent = `⏰ 最后 ${seconds} 秒！`;
          display.style.color = "#ff5722"; // 最后10秒变成橙红色
        }
      }

      function reopenTask() {

          if (taskNeedsWaiting(position)) {
            const playersAtSamePosition = getPlayersAtPosition(position);
            const allPlayersPassed = allOtherPlayersPassed(position);

            if (playersAtSamePosition.length > 0) {
              // 有其他玩家在相同位置，显示协作任务
              showCollaborativeTask(position, playersAtSamePosition);
              return;
            } else if (allPlayersPassed) {
              // 所有其他玩家都已经过了这个位置，显示继续选项
              showWaitingTaskWithContinueOption(position);
              return;

      // 初始化画布
      function initCanvas() {
        const canvas = document.getElementById("logoCanvas");
        const ctx = canvas.getContext("2d");
        let isDrawing = false;

        // 设置画布上下文属性
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        // 获取正确的坐标位置
        function getCanvasCoordinates(e, canvas) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;

          if (e.touches && e.touches.length > 0) {
            // 触摸事件
            const touch = e.touches[0];
            return {
              x: (touch.clientX - rect.left) * scaleX,
              y: (touch.clientY - rect.top) * scaleY,
            };
          } else {
            // 鼠标事件
            return {
              x: (e.clientX - rect.left) * scaleX,
              y: (e.clientY - rect.top) * scaleY,
            };
          }
        }

        // 鼠标事件
        canvas.addEventListener("mousedown", (e) => {
          e.preventDefault();
          isDrawing = true;
          const coords = getCanvasCoordinates(e, canvas);
          ctx.beginPath();
          ctx.moveTo(coords.x, coords.y);
        });

        canvas.addEventListener("mousemove", (e) => {
          e.preventDefault();
          if (isDrawing) {
            const coords = getCanvasCoordinates(e, canvas);

            if (drawingTool === "pen") {
              ctx.globalCompositeOperation = "source-over";
              ctx.strokeStyle = drawingColor;
              ctx.lineWidth = 2;
            } else if (drawingTool === "eraser") {
              ctx.globalCompositeOperation = "destination-out";
              ctx.lineWidth = 10;
            }

            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
          }
        });

        canvas.addEventListener("mouseup", (e) => {
          e.preventDefault();
          isDrawing = false;
        });

        // 触摸设备支持
        canvas.addEventListener("touchstart", (e) => {
          e.preventDefault();
          if (e.touches.length === 1) {
            isDrawing = true;
            const coords = getCanvasCoordinates(e, canvas);
            ctx.beginPath();
            ctx.moveTo(coords.x, coords.y);
          }
        });

        canvas.addEventListener("touchmove", (e) => {
          e.preventDefault();
          if (isDrawing && e.touches.length === 1) {
            const coords = getCanvasCoordinates(e, canvas);

            if (drawingTool === "pen") {
              ctx.globalCompositeOperation = "source-over";
              ctx.strokeStyle = drawingColor;
              ctx.lineWidth = 3; // 触摸时稍微粗一点
            } else if (drawingTool === "eraser") {
              ctx.globalCompositeOperation = "destination-out";
              ctx.lineWidth = 15; // 触摸时橡皮擦稍微大一点
            }

            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
          }
        });

        canvas.addEventListener("touchend", (e) => {
          e.preventDefault();
          isDrawing = false;
        });

        // 防止触摸时页面滚动
        canvas.addEventListener("touchcancel", (e) => {
          e.preventDefault();
          isDrawing = false;
        });
      }

        const canvas = document.getElementById("logoCanvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      // 完成任务
      async function completeTask() {
        if (!currentTask) return;

        // 清除倒计时
        if (countdownInterval) {
          clearInterval(countdownInterval);
          countdownInterval = null;
        }
        countdownStartTime = null; // 清除开始时间

        try {
          const submission = new Submission();
          submission.set("playerId", currentPlayer.id);
          submission.set("playerName", currentPlayer.get("name"));
          submission.set("position", currentTask.position);
          submission.set("taskTitle", currentTask.title);

          // 如果有选中的朋友，记录朋友信息
          if (selectedFriend) {
            submission.set("friendId", selectedFriend.id);
            submission.set("friendName", selectedFriend.get("name"));
          }

          // 如果是等待任务，记录协作伙伴信息
          if (taskNeedsWaiting(currentTask.position)) {
            const collaborators = getPlayersAtPosition(currentTask.position);
            if (collaborators.length > 0) {
              const collaboratorNames = collaborators.map((p) => p.get("name"));
              const collaboratorIds = collaborators.map((p) => p.id);
              submission.set("collaboratorNames", collaboratorNames);
              submission.set("collaboratorIds", collaboratorIds);
              submission.set("taskType", "collaborative");
            } else {
              submission.set("taskType", "solo"); // 单独完成
            }
          }

          switch (currentTask.type) {
            case "text":
              // 检查是否是特殊的多输入任务
              if (currentTask.position === 7) {
                // 相信基督教的理由任务
                const believeReason1 =
                  document.getElementById("believeReason1")?.value.trim() || "";
                const believeReason2 =
                  document.getElementById("believeReason2")?.value.trim() || "";
                const doubtReason1 =
                  document.getElementById("doubtReason1")?.value.trim() || "";
                const doubtReason2 =
                  document.getElementById("doubtReason2")?.value.trim() || "";

                const content = {
                  believeReasons: [believeReason1, believeReason2],
                  doubtReasons: [doubtReason1, doubtReason2],
                };

                submission.set("content", JSON.stringify(content));
                submission.set("type", "multi-text");
              } else if (currentTask.position === 9) {
                // 诗歌歌单任务
                const theme =
                  document.getElementById("playlistTheme")?.value.trim() || "";
                const description =
                  document
                    .getElementById("playlistDescription")
                    ?.value.trim() || "";
                const songs = [];

                for (let i = 1; i <= 5; i++) {
                  const song =
                    document.getElementById(`song${i}`)?.value.trim() || "";
                  if (song) songs.push(song);
                }

                const content = {
                  theme: theme,
                  description: description,
                  songs: songs,
                };

                submission.set("content", JSON.stringify(content));
                submission.set("type", "playlist");
              } else if (currentTask.position === 25) {
                // 主日三件事任务
                const sunday1 =
                  document.getElementById("sunday1")?.value.trim() || "";
                const sunday2 =
                  document.getElementById("sunday2")?.value.trim() || "";
                const sunday3 =
                  document.getElementById("sunday3")?.value.trim() || "";

                const content = {
                  things: [sunday1, sunday2, sunday3].filter(
                    (thing) => thing !== ""
                  ),
                };

                submission.set("content", JSON.stringify(content));
                submission.set("type", "sunday-list");
              } else if (currentTask.position === 30) {
                // 生命见证任务 - 过去现在未来
                const pastWord1 =
                  document.getElementById("pastWord1")?.value.trim() || "";
                const pastWord2 =
                  document.getElementById("pastWord2")?.value.trim() || "";
                const presentWord1 =
                  document.getElementById("presentWord1")?.value.trim() || "";
                const presentWord2 =
                  document.getElementById("presentWord2")?.value.trim() || "";
                const futureWord1 =
                  document.getElementById("futureWord1")?.value.trim() || "";
                const futureWord2 =
                  document.getElementById("futureWord2")?.value.trim() || "";

                const content = {
                  past: [pastWord1, pastWord2].filter((word) => word !== ""),
                  present: [presentWord1, presentWord2].filter(
                    (word) => word !== ""
                  ),
                  future: [futureWord1, futureWord2].filter(
                    (word) => word !== ""
                  ),
                };

                submission.set("content", JSON.stringify(content));
                submission.set("type", "life-journey");
              } else {
                // 普通文本任务
                const textInput = document.getElementById("taskTextInput");
                if (textInput && textInput.value.trim()) {
                  submission.set("content", textInput.value.trim());
                  submission.set("type", "text");
                }
              }
              break;
            case "draw":
              const canvas = document.getElementById("logoCanvas");
              if (canvas) {
                const dataURL = canvas.toDataURL();
                submission.set("content", dataURL);
                submission.set("type", "image");
              }
              break;
            case "offline":
              // 等待任务都是线下任务
              if (taskNeedsWaiting(currentTask.position)) {
                submission.set("content", "协作任务完成");
                submission.set("type", "collaborative");
              } else {
                submission.set("content", "任务完成");
                submission.set("type", "simple");
              }
              break;
            case "penalty":
              // 显示惩罚弹窗而不是直接倒退
              showPenaltyModal();
              return; // 不要立即关闭任务弹窗
            default:
              submission.set("content", "任务完成");
              submission.set("type", "simple");
              break;
          }

          await submission.save();

          // 清除当前任务和选中的朋友
          currentTask = null;
          selectedFriend = null;
          countdownStartTime = null; // 清除开始时间
          closeTaskModal();

          // 任务完成后重新启用掷色子按钮（仅在游戏进行中）
          const rollButton = document.getElementById("rollDiceBtn");
          if (
            rollButton &&
            gameState &&
            gameState.get("isStarted") &&
            !gameState.get("isEnded")
          ) {
            rollButton.disabled = false;
          }
          document.getElementById("viewTaskBtn").style.display = "none";
        } catch (error) {
          console.error("提交任务失败:", error);
          alert("提交失败，请重试");
        }
      }

      function closeTaskModal() {
        document.getElementById("taskModal").classList.remove("active");

        // 暂停倒计时但不清除状态
        if (countdownInterval) {
          clearInterval(countdownInterval);
          countdownInterval = null;
          // 注意：不清除 countdownStartTime，保持倒计时进度
        }

        // 如果任务还未完成，保持任务状态
        if (currentTask) {
          const rollButton = document.getElementById("rollDiceBtn");
          if (
            rollButton &&
            gameState &&
            gameState.get("isStarted") &&
            !gameState.get("isEnded")
          ) {

      async function deletePlayer(player) {
        if (!confirm(`确定要删除玩家 "${player.get("name")}" 吗？`)) {
          return;
        }

        try {
          await player.destroy();

          // 同时删除该玩家的提交内容
          const submissionQuery = new AV.Query(Submission);
          submissionQuery.equalTo("playerId", player.id);
          const submissions = await submissionQuery.find();
          if (submissions.length > 0) {
            await AV.Object.destroyAll(submissions);
          }

          // 刷新玩家列表
          await loadGameState();

          alert(`玩家 "${player.get("name")}" 已删除`);
        } catch (error) {
          console.error("删除玩家失败:", error);
          alert("删除失败，请重试");
        }
      }

      // 清除所有数据
      async function clearAllData() {
        if (
          !confirm(
            "⚠️ 警告：此操作将清除所有游戏数据，包括玩家信息、游戏状态和提交内容！\n\n确定要继续吗？"

        ) {
          return;
        }

        if (!confirm("请再次确认：真的要清除所有数据吗？此操作无法撤销！")) {
          return;
        }

        try {
          // 清除玩家数据
          const playerQuery = new AV.Query(Player);
          const playersToDelete = await playerQuery.find();
          if (playersToDelete.length > 0) {
            await AV.Object.destroyAll(playersToDelete);
          }

          // 清除游戏状态
          const gameQuery = new AV.Query(GameState);
          const gamesToDelete = await gameQuery.find();
          if (gamesToDelete.length > 0) {
            await AV.Object.destroyAll(gamesToDelete);
          }

          // 清除提交内容
          const submissionQuery = new AV.Query(Submission);
          const submissionsToDelete = await submissionQuery.find();
          if (submissionsToDelete.length > 0) {
            await AV.Object.destroyAll(submissionsToDelete);
          }

          // 重置界面
          players = [];
          gameState = null;
          document.getElementById("playersList").innerHTML = "";
          document.getElementById("hostBoard").innerHTML = "";
          document.getElementById("gameInfo").innerHTML = "";
          document.getElementById("startGameBtn").disabled = false;
          document.getElementById("endGameBtn").disabled = true;

          alert("✅ 所有数据已清除完毕！");
        } catch (error) {
          console.error("清除数据失败:", error);
          alert("❌ 清除数据失败，请重试");
        }
      }

      function initFireworks() {
        const canvas = document.getElementById("fireworksCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const fireworks = [];
        const particles = [];

        // 烟花动画逻辑
        function createFirework() {
          fireworks.push({
            x: Math.random() * canvas.width,
            y: canvas.height,
            targetY: Math.random() * canvas.height * 0.5,
            color: `hsl(${Math.random() * 360}, 100%, 50%)`,
            exploded: false,
            life: 0,
          });
        }

        function animate() {
          ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // 创建烟花
          if (Math.random() < 0.1) {
            createFirework();
          }

          // 更新烟花
          fireworks.forEach((firework, index) => {
            if (!firework.exploded) {
              firework.y -= 5;
              ctx.fillStyle = firework.color;
              ctx.fillRect(firework.x, firework.y, 2, 10);

              if (firework.y <= firework.targetY) {
                // 爆炸
                firework.exploded = true;
                for (let i = 0; i < 30; i++) {
                  particles.push({
                    x: firework.x,
                    y: firework.y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    color: firework.color,
                    life: 50,
                  });
                }
                fireworks.splice(index, 1);
              }
            }
          });

          // 更新粒子
          particles.forEach((particle, index) => {
            particle.x += particle.vx;
            particle.y += particle.vy;
            particle.vy += 0.1; // 重力
            particle.life--;

            ctx.globalAlpha = particle.life / 50;
            ctx.fillStyle = particle.color;
            ctx.fillRect(particle.x, particle.y, 2, 2);

            if (particle.life <= 0) {
              particles.splice(index, 1);
            }
          });

          ctx.globalAlpha = 1;
          requestAnimationFrame(animate);
        }

        animate();
      }

      function clearHostCanvas() {
        const canvas = document.getElementById("hostLogoCanvas");

      function initHostCanvas() {
        const canvas = document.getElementById("hostLogoCanvas");
        const ctx = canvas.getContext("2d");
        let isDrawing = false;

        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        // 获取正确的坐标位置
        function getCanvasCoordinates(e, canvas) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;

          if (e.touches && e.touches.length > 0) {
            const touch = e.touches[0];
            return {
              x: (touch.clientX - rect.left) * scaleX,
              y: (touch.clientY - rect.top) * scaleY,
            };
          } else {
            return {
              x: (e.clientX - rect.left) * scaleX,
              y: (e.clientY - rect.top) * scaleY,
            };
          }
        }

        // 鼠标和触摸事件
        canvas.addEventListener("mousedown", (e) => {
          e.preventDefault();
          isDrawing = true;
          const coords = getCanvasCoordinates(e, canvas);
          ctx.beginPath();
          ctx.moveTo(coords.x, coords.y);
        });

        canvas.addEventListener("mousemove", (e) => {
          e.preventDefault();
          if (isDrawing) {
            const coords = getCanvasCoordinates(e, canvas);

            if (drawingTool === "pen") {
              ctx.globalCompositeOperation = "source-over";
              ctx.strokeStyle = drawingColor;
              ctx.lineWidth = 2;
            } else if (drawingTool === "eraser") {
              ctx.globalCompositeOperation = "destination-out";
              ctx.lineWidth = 10;
            }

            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
          }
        });

        canvas.addEventListener("mouseup", (e) => {
          e.preventDefault();
          isDrawing = false;
        });

        // 触摸事件
        canvas.addEventListener("touchstart", (e) => {
          e.preventDefault();
          if (e.touches.length === 1) {
            isDrawing = true;
            const coords = getCanvasCoordinates(e, canvas);
            ctx.beginPath();
            ctx.moveTo(coords.x, coords.y);
          }
        });

        canvas.addEventListener("touchmove", (e) => {
          e.preventDefault();
          if (isDrawing && e.touches.length === 1) {
            const coords = getCanvasCoordinates(e, canvas);

            if (drawingTool === "pen") {
              ctx.globalCompositeOperation = "source-over";
              ctx.strokeStyle = drawingColor;
              ctx.lineWidth = 3;
            } else if (drawingTool === "eraser") {
              ctx.globalCompositeOperation = "destination-out";
              ctx.lineWidth = 15;
            }

            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
          }
        });

        canvas.addEventListener("touchend", (e) => {
          e.preventDefault();
          isDrawing = false;
        });

        canvas.addEventListener("touchcancel", (e) => {
          e.preventDefault();
          isDrawing = false;
        });
      }

      // 更新玩家位置
      async function updatePlayerPosition(playerId) {
        const input = document.getElementById(`pos-${playerId}`);
        const newPosition = parseInt(input.value);

        if (isNaN(newPosition) || newPosition < 0 || newPosition > 31) {
          alert("请输入有效的位置 (0-31)");
          return;
        }

        try {
          const player = players.find((p) => p.id === playerId);
          if (!player) {
            alert("找不到该玩家");
            return;
          }

          const oldPosition = player.get("position");
          player.set("position", newPosition);
          await player.save();

          // 刷新游戏状态
          await loadGameState();

          alert(
            `已将 ${player.get(
              "name"
            )} 的位置从 ${oldPosition} 更新为 ${newPosition}`
          );
        } catch (error) {
          console.error("更新位置失败:", error);
          alert("更新失败，请重试");
        }
      }

          {

      // 当前题目状态
      let currentQuestionType = "";
      let currentQuestionIndex = -1;
      let questionPools = {
        charades: [...gameQuestions.charades],
        bible: [...gameQuestions.bible],
        spiritual: [...gameQuestions.spiritual],
        emoji: [...gameQuestions.emoji],
      };

      // 显示游戏题目选择弹窗
      function showGameQuestionModal() {
        document.getElementById("gameQuestionModal").classList.add("active");
      }

      // 关闭游戏题目选择弹窗
      function closeGameQuestionModal() {
        document.getElementById("gameQuestionModal").classList.remove("active");
      }

      // 选择游戏类型
      function selectGameType(type) {
        currentQuestionType = type;
        closeGameQuestionModal();
        getNextQuestion();
      }

      // 获取下一题
      function getNextQuestion() {
        const answerDiv = document.getElementById("bibleAnswer");
        const toggleBtn = document.getElementById("toggleAnswerBtn");
        const fillBtn = document.getElementById("fillBlanksBtn");

        if (answerDiv) {
          answerDiv.style.display = "none";
          answerDiv.style.opacity = "1";
          answerDiv.style.transform = "translateY(0)";
        }
        if (toggleBtn) {
          toggleBtn.textContent = "📖 显示答案";
          toggleBtn.style.background = "#4CAF50";
        }
        if (fillBtn) {
          fillBtn.textContent = "💡 填入空格";
          fillBtn.style.background = "#2196F3";
          fillBtn.disabled = false;
        }
        const pool = questionPools[currentQuestionType];

        if (pool.length === 0) {
          alert("该类型的题目已全部用完！");
          closeQuestionDisplay();
          return;
        }

        // 随机选择一题
        currentQuestionIndex = Math.floor(Math.random() * pool.length);
        const question = pool[currentQuestionIndex];

        displayQuestion(question);
      }

      // 显示题目
      function displayQuestion(question) {
        const modal = document.getElementById("questionDisplayModal");
        const gameTypeElement = document.getElementById("questionGameType");
        const contentElement = document.getElementById("questionContent");

        // 设置游戏类型标题
        const typeNames = {
          charades: "🎭 你比划我猜",
          bible: "📖 圣经问题",
          spiritual: "🙏 属灵问题",
          emoji: "🎯 看图识字",
        };
        gameTypeElement.textContent = typeNames[currentQuestionType];

        // 显示统计信息
        const pool = questionPools[currentQuestionType];
        const totalQuestions = gameQuestions[currentQuestionType].length;
        const remainingQuestions = pool.length;

        let content = `
          <div class="question-stats">
            <h4>题目统计</h4>
            <div class="question-pool-info">
              剩余题目：${remainingQuestions} / ${totalQuestions}
            </div>
          </div>
        `;

        // 根据题目类型显示内容
        if (currentQuestionType === "charades") {
          content += `
            <div class="question-display">
              <div class="charades-question">${question.question}</div>
              <div class="charades-hint">提示：${question.hint}</div>
            </div>
          `;
        } else if (currentQuestionType === "bible") {
          const questionText = question.question.replace(
            /<blank>/g,
            '<span class="bible-blank"></span>'
          );
          content += `
    <div class="question-display">
      <div class="bible-question">${questionText}</div>
      <div class="bible-answer-section">
        <button class="button" id="toggleAnswerBtn" onclick="toggleBibleAnswer()" 
                style="background: #4CAF50; font-size: 14px; padding: 8px 16px; margin: 10px 5px;">
          📖 显示答案
        </button>
        <button class="button" id="fillBlanksBtn" onclick="fillBlanks()" 
                style="background: #2196F3; font-size: 14px; padding: 8px 16px; margin: 10px 5px;">
          💡 填入空格
        </button>
        <div id="bibleAnswer" class="bible-answer" style="display: none; font-size: 14px; color: #666; margin-top: 10px;">
          <strong>参考答案：</strong><span style="color: #4CAF50; font-weight: bold;">${question.answer}</span>
        </div>
      </div>
    </div>
  `;
        } else if (currentQuestionType === "spiritual") {
          // 选择题不显示答案
          content += `
    <div class="question-display">
      <div class="spiritual-question"><strong>${
        question.question
      }</strong></div>
      <div class="spiritual-options">
        ${question.options
          .map(
            (option, index) =>
              `<div class="spiritual-option" onclick="selectOption('${option.charAt(
                0
              )}', ${index})" data-option="${option.charAt(0)}">${option}</div>`
          )
          .join("")}
      </div>
    </div>
  `;
        } else if (currentQuestionType === "emoji") {
          content += `
    <div class="question-display">
      <div class="emoji-question" style="font-size: 64px; margin: 30px 0; text-align: center; line-height: 1.2;">
        ${question.emojis}
      </div>
      <div class="emoji-hint" style="color: #666; font-size: 16px; margin-bottom: 20px; text-align: center;">
        请根据这些emoji猜出对应的成语
      </div>
      <div id="emojiAnswer" class="emoji-answer" style="display: none; font-size: 18px; color: #4CAF50; margin: 20px 0; font-weight: bold; text-align: center;">
        答案：${question.answer}
      </div>
    </div>
  `;
        }

        contentElement.innerHTML = content;
        // 根据题目类型显示不同的按钮
        updateActionButtons();
        modal.classList.add("active");
      }

      // 标记回答正确
      function markCorrect() {
        // 从题目池中移除这道题
        questionPools[currentQuestionType].splice(currentQuestionIndex, 1);

        // 更新显示
        updateQuestionStats();
        setTimeout(() => {
          getNextQuestion();
        }, 500);
      }

      // 标记回答错误
      function markIncorrect() {
        setTimeout(() => {
          getNextQuestion();
        }, 500);
      }

      // 更新题目统计
      function updateQuestionStats() {
        const pool = questionPools[currentQuestionType];
        const totalQuestions = gameQuestions[currentQuestionType].length;
        const remainingQuestions = pool.length;

        const statsElement = document.querySelector(".question-pool-info");
        if (statsElement) {
          statsElement.textContent = `剩余题目：${remainingQuestions} / ${totalQuestions}`;
        }
      }

      // 关闭题目显示
      function closeQuestionDisplay() {
        document
          .getElementById("questionDisplayModal")
          .classList.remove("active");
        currentQuestionType = "";
        currentQuestionIndex = -1;
      }
      // 选择选项（这是关键功能）
      function selectOption(selectedAnswer, optionIndex) {
        const pool = questionPools[currentQuestionType];
        const question = pool[currentQuestionIndex];
        const correctAnswer = question.answer;
        const options = document.querySelectorAll(".spiritual-option");

        // 禁用所有选项的点击
        options.forEach((option) => {
          option.style.pointerEvents = "none";
        });

        if (selectedAnswer === correctAnswer) {
          // 回答正确 - 显示绿色
          options[optionIndex].style.backgroundColor = "#4CAF50";
          options[optionIndex].style.color = "white";
          options[optionIndex].style.borderColor = "#4CAF50";

          // 从题目池中移除
          questionPools[currentQuestionType].splice(currentQuestionIndex, 1);
          updateQuestionStats();
        } else {
          // 回答错误 - 选中的显示红色
          options[optionIndex].style.backgroundColor = "#f44336";
          options[optionIndex].style.color = "white";
          options[optionIndex].style.borderColor = "#f44336";

          // 正确答案显示绿色
          options.forEach((option) => {
            if (option.dataset.option === correctAnswer) {
              option.style.backgroundColor = "#4CAF50";
              option.style.color = "white";
              option.style.borderColor = "#4CAF50";
            }
          });
        }
      }

      // 更新按钮
      function updateActionButtons() {
        const buttonsContainer = document.getElementById("actionButtons");

        if (currentQuestionType === "spiritual") {
          // 选择题只显示"下一题"按钮
          buttonsContainer.innerHTML = `
            <div style="margin-top: 15px; text-align: center;">
              <button class="button" onclick="getNextQuestion()">下一题</button>
              <button class="button" onclick="closeQuestionDisplay()">关闭</button>
            </div>
          `;
        } else if (currentQuestionType === "emoji") {
          // emoji题目显示特殊按钮布局
          buttonsContainer.innerHTML = `
      <div style="margin-top: 20px; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
        <button class="button" style="background: #4CAF50;" onclick="markCorrect()">✅ 回答正确</button>
        <button class="button" style="background: #f44336;" onclick="markIncorrect()">❌ 回答错误</button>
        <button class="button" style="background: #2196F3;" onclick="toggleEmojiAnswer()">👁️ 显示答案</button>
      </div>
      <div style="margin-top: 15px; text-align: center;">
        <button class="button" onclick="getNextQuestion()">跳过</button>
        <button class="button" onclick="closeQuestionDisplay()">关闭</button>
      </div>
    `;
        } else {
          // 其他题目显示"回答正确/错误"按钮
          buttonsContainer.innerHTML = `
            <div style="margin-top: 20px; display: flex; gap: 15px; justify-content: center;">
              <button class="button" style="background: #4CAF50;" onclick="markCorrect()">✅ 回答正确</button>
              <button class="button" style="background: #f44336;" onclick="markIncorrect()">❌ 回答错误</button>
            </div>
            <div style="margin-top: 15px; text-align: center;">
              <button class="button" onclick="getNextQuestion()">跳过</button>
              <button class="button" onclick="closeQuestionDisplay()">关闭</button>
            </div>
          `;
        }
      }
      // 切换答案显示/隐藏
      function toggleBibleAnswer() {
        const answerDiv = document.getElementById("bibleAnswer");
        const toggleBtn = document.getElementById("toggleAnswerBtn");

        if (!answerDiv || !toggleBtn) return;

        if (answerDiv.style.display === "none") {
          // 显示答案
          answerDiv.style.display = "block";
          toggleBtn.textContent = "🙈 隐藏答案";
          toggleBtn.style.background = "#f44336";

          // 添加显示动画
          answerDiv.style.opacity = "0";
          answerDiv.style.transform = "translateY(-10px)";
          answerDiv.style.transition = "all 0.3s ease";

          setTimeout(() => {
            answerDiv.style.opacity = "1";
            answerDiv.style.transform = "translateY(0)";
          }, 10);
        } else {
          // 隐藏答案
          answerDiv.style.opacity = "0";
          answerDiv.style.transform = "translateY(-10px)";

          setTimeout(() => {
            answerDiv.style.display = "none";
            toggleBtn.textContent = "📖 显示答案";
            toggleBtn.style.background = "#4CAF50";
          }, 300);
        }
      }

      // 直接在空格中填入答案
      function fillBlanks() {
        const questionText =
          document.querySelector(".bible-question").innerHTML;
        const pool = questionPools[currentQuestionType];
        const question = pool[currentQuestionIndex];
        const answers = question.answer.split("，"); // 支持多个答案用逗号分隔

        let answerIndex = 0;
        const updatedText = questionText.replace(
          /<span class="bible-blank"><\/span>/g,
          () => {
            const answer = answers[answerIndex] || "";
            answerIndex++;
            return `<span class="bible-blank filled" style="background: #e8f5e8; color: #2e7d32; font-weight: bold; padding: 2px 8px; border-radius: 4px;">${answer}</span>`;
          }
        );

        document.querySelector(".bible-question").innerHTML = updatedText;

        // 更改按钮状态
        const fillBtn = document.getElementById("fillBlanksBtn");
        if (fillBtn) {
          fillBtn.textContent = "✅ 已填入";
          fillBtn.style.background = "#4CAF50";
          fillBtn.disabled = true;
        }
      }
      // 检查emoji答案
      function checkEmojiAnswer() {
        const input = document.getElementById("emojiAnswer");
        const userAnswer = input.value.trim();

        if (!userAnswer) {
          alert("请输入答案！");
          return;
        }

        const pool = questionPools[currentQuestionType];
        const question = pool[currentQuestionIndex];
        const correctAnswer = question.answer;

        if (userAnswer === correctAnswer) {
          input.style.background = "#e8f5e8";
          input.style.borderColor = "#4CAF50";
          input.value = `✅ ${correctAnswer}`;

          // 从题目池中移除
          questionPools[currentQuestionType].splice(currentQuestionIndex, 1);
          updateQuestionStats();

          setTimeout(() => {
            getNextQuestion();
          }, 1500);
        } else {
          input.style.background = "#ffebee";
          input.style.borderColor = "#f44336";

          // 显示正确答案
          setTimeout(() => {
            input.value = `正确答案：${correctAnswer}`;
            input.style.background = "#e8f5e8";
            input.style.borderColor = "#4CAF50";

            setTimeout(() => {
              getNextQuestion();
            }, 2000);
          }, 1000);
        }
      }
      // 切换emoji答案显示
      function toggleEmojiAnswer() {
        const answerDiv = document.getElementById("emojiAnswer");
        const button = event.target;

        if (answerDiv.style.display === "none") {
          answerDiv.style.display = "block";
          button.textContent = "🙈 隐藏答案";
          button.style.background = "#f44336";
        } else {
          answerDiv.style.display = "none";
          button.textContent = "👁️ 显示答案";
          button.style.background = "#2196F3";
        }
      }
